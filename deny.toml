[graph]
all-features = true

[advisories]
version = 2
# Add RUSTSEC ids here only with a comment explaining the accepted risk.
ignore = []

[licenses]
version = 2
# The allow list is a policy, not an inventory: entries no crate currently uses
# are the point, not a warning.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # xxhash-rust, pulled in by the NATS client. Permissive, and explicitly
    # compatible with the rest of this list.
    "BSL-1.0",
    # webpki-roots, pulled in by the TLS stack under async-nats. It covers the
    # certificate *data*, not code.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Kept for dev-dependencies, which may still name a path with no version. The
# three internal libraries no longer need it: each is declared in the root
# manifest with both a path and a version requirement, so nothing in the graph
# resolves to `*`. Do not reach for this to silence a wildcard on a crates.io
# dependency — that is the case it is meant to keep denying.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
