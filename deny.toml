[graph]
all-features = true

[advisories]
version = 2
# Add RUSTSEC ids here only with a comment explaining the accepted risk.
ignore = []

[licenses]
version = 2
# The allow list is a policy, not an inventory: entries no crate currently uses
# are the point, not a warning.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `service-core.workspace = true` resolves to a path dependency with no version,
# which cargo-deny reads as `*`. These crates are unpublished, so a version
# requirement would be meaningless — but wildcards on crates.io deps stay denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
