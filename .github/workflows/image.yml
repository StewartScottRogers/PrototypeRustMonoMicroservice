name: Image

on:
  pull_request:
  push:
    branches: [master]
    # Per-crate tags, the shape release-plz produces (e.g. echo-service-v0.2.0).
    tags: ["*-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    name: Discover services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: metadata
      - id: detect
        run: |
          services="$(.github/scripts/binary-crates.sh)"
          echo "Services: $services"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          if [ "$services" = "[]" ]; then any=false; else any=true; fi
          echo "any=$any" >> "$GITHUB_OUTPUT"

  image:
    name: image (${{ matrix.service }})
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image and its attestation to GHCR
      id-token: write # OIDC token proving which workflow built it
      attestations: write # write to GitHub's attestation store
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The token must not survive into the build context, which is the
          # whole workspace and ends up inside a published image layer.
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # GHCR rejects any uppercase character in a repository name, and this
      # org/repo has several. Never interpolate github.repository directly.
      - name: Compute image name
        id: name
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          owner_repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_repo}/${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          # A PR builds to prove the Dockerfile still works; it must not publish.
          push: ${{ github.event_name != 'pull_request' }}
          # Also leave the image in the local daemon so the scan below has
          # something to read on pull requests, where nothing is pushed.
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.service }}
          provenance: false # GitHub's attestation below replaces BuildKit's

      # Catches CVEs in the base image, which cargo-deny cannot see: it audits
      # crates, not the Debian packages underneath them. Scanning the locally
      # loaded image means a PR is blocked before the image is ever published.
      #
      # ignore-unfixed because an advisory with no available patch is not
      # actionable here - it would turn the gate into noise that gets ignored.
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master, 0.33.1
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Signs "this digest came from this workflow, repo, and commit", and
      # stores it next to the image. Verify with:
      #   gh attestation verify oci://<image>:<tag> --repo <owner>/<repo>
      # GitHub refuses to persist attestations for user-owned private repos:
      # "Feature not available for user-owned private repositories." Making the
      # repo public, or moving it to an org on Team/Enterprise, turns this on
      # with no further change here.
      - name: Attest build provenance
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Single required status check for this workflow, same reasoning as CI OK.
  image-ok:
    name: Image OK
    if: always()
    needs: [discover, image]
    runs-on: ubuntu-latest
    steps:
      - name: Check every upstream job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$RESULTS" > /dev/null
