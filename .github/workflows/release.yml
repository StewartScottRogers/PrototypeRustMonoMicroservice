name: Release

# Creates the git tag and the GitHub Release for every crate whose version in
# its manifest has no matching tag yet, and does nothing at all when they
# already match. Safe to run repeatedly.
#
# The tag it creates looks like `worker-service-v0.2.0`, which is what
# .github/workflows/image.yml triggers on to build and publish that one
# service's image at that version.
#
# There is no "release pull request" job, and its absence is deliberate rather
# than unfinished. release-plz can open a pull request that bumps versions and
# writes changelogs, and it decides the next version by running `cargo package`
# — which resolves every dependency from a registry. The services here depend on
# messaging-core, db-core and service-core, which exist nowhere but this
# repository, so that resolution cannot succeed and the job could only ever
# fail. It was tried against both possible `publish` settings and fails on both.
#
# So version numbers are raised by hand, in the ordinary pull request that
# earns the raise, and this workflow turns a raised version into a tag, a
# release and an image. What it would take to get the automation back is a
# registry holding the three library crates; see
# .claude/skills/rust-release/SKILL.md.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never two release runs at once: two would race to create the same tag.
# cancel-in-progress is deliberately false - cancelling half-way through
# tagging would leave some crates released and others not.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the git tags and the GitHub Releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Whole history. release-plz decides what is already released by
          # looking at the tags, and a shallow checkout has none of them.
          fetch-depth: 0
          # release-plz authenticates with the token passed to it below, so the
          # checkout does not need to leave one behind in .git/config.
          persist-credentials: false

      # release-plz shells out to cargo to read the workspace graph, so a
      # toolchain has to be present even though nothing is compiled here.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release

      # RELEASE_PLZ_TOKEN matters even with no pull request to open: a tag
      # pushed using the automatic GITHUB_TOKEN starts no other workflow, which
      # is a GitHub loop-prevention rule, so the Image workflow would never see
      # it and no versioned image would ever be built. The fallback keeps this
      # runnable without the secret - the tags and releases still appear, and
      # the image builds have to be dispatched by hand.
      - name: Tag and publish the GitHub Releases
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
