# Local development stack.
#
# Start it with DevStart.cmd rather than calling docker directly - the script
# waits for every container to report healthy and prints the URLs.
#
#   DevStart.cmd    build and start
#   DevDemo.cmd     run the whole demonstration and narrate it
#   DevStatus.cmd   what is running, and is it healthy
#   DevLogs.cmd     follow the logs
#   DevStop.cmd     stop, keep the containers
#   DevDelete.cmd   remove containers and the network, keep data and images
#   DevRemove.cmd   remove everything, including the database volumes
#
# What this stack demonstrates:
#
#   you --POST /order--> gateway --writes order+message in ONE transaction--> postgres
#                            |
#                    outbox relay publishes
#                            v
#                   [ORDER_COMMANDS stream]
#                            |
#              one shared consumer, two workers        <- MESSAGING: split
#                            v
#                        worker x2
#                            |
#                    publishes an event
#                            v
#                    [ORDER_EVENTS stream]
#                       /            \                 <- EVENTING: copied
#            notifier consumer     audit consumer
#                   |                     |
#            logs a notification    writes to postgres
#
# Every hop is one trace in Jaeger at http://localhost:16686.

name: prototype-rust-microservices

# YAML anchors: defined once, merged into each service below with <<:. Keeps
# nine services from repeating the same six lines.
x-service-defaults: &service-defaults
  restart: unless-stopped
  environment: &service-environment
    RUST_LOG: ${RUST_LOG:-info}
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://redis:6379
    DATABASE_URL: postgres://${POSTGRES_USER:-devuser}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-devdb}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

# The image is distroless - no shell, no curl - so each service probes itself.
# See service_core::health::self_check.
x-service-healthcheck: &service-healthcheck
  test: ["CMD", "/usr/local/bin/service", "healthcheck"]
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 15s

services:
  # ---------------------------------------------------------------------------
  # The services
  # ---------------------------------------------------------------------------

  gateway-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway-service
    image: prototype-rust/gateway-service:dev
    environment:
      <<: *service-environment
      PORT: 8080
      ECHO_SERVICE_URL: http://echo-service:8080
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      # No NATS dependency: this service only writes the outbox. Publishing is
      # outbox-relay's job.
      postgres: { condition: service_healthy }
      echo-service: { condition: service_healthy }
    healthcheck: *service-healthcheck

  # Reads committed outbox rows and publishes them. Its own process rather than
  # a background task in the gateway, so HTTP throughput and relay throughput
  # scale for their own reasons. Safe to run more than one - FOR UPDATE SKIP
  # LOCKED means each claims a different set of rows.
  outbox-relay:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: outbox-relay
    image: prototype-rust/outbox-relay:dev
    environment:
      <<: *service-environment
      PORT: 8080
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck: *service-healthcheck

  # One-shot tool, not a service. `profiles` keeps it out of DevStart.cmd;
  # DevReplay.cmd runs it on demand with `docker compose run`.
  #
  # Automatic replay would be a trap: a message is dead-lettered precisely
  # because it kept failing, so replaying it on a timer loops forever. Draining
  # the queue is a decision a person makes after fixing something.
  dlq-replay:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: dlq-replay
    image: prototype-rust/dlq-replay:dev
    environment:
      <<: *service-environment
    restart: "no"

  worker-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: worker-service
    image: prototype-rust/worker-service:dev
    environment:
      <<: *service-environment
      PORT: 8080
    # Two replicas sharing one durable consumer. This is the messaging half of
    # the demonstration: the load splits, it does not double. No ports are
    # published because two containers cannot bind the same host port.
    deploy:
      replicas: 2
    depends_on:
      nats: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: *service-healthcheck

  notifier-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notifier-service
    image: prototype-rust/notifier-service:dev
    environment:
      <<: *service-environment
      PORT: 8080
    depends_on:
      nats: { condition: service_healthy }
    healthcheck: *service-healthcheck

  audit-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: audit-service
    image: prototype-rust/audit-service:dev
    environment:
      <<: *service-environment
      PORT: 8080
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck: *service-healthcheck

  echo-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: echo-service
    image: prototype-rust/echo-service:dev
    environment:
      <<: *service-environment
      PORT: 8080
    ports:
      # Exposed separately so the synchronous path can be called directly.
      - "${ECHO_PORT:-8081}:8080"
    healthcheck: *service-healthcheck

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  nats:
    image: nats:2-alpine
    # -js enables JetStream (the persistent log). Without it only plain
    # fire-and-forget pub/sub works, and every durable consumer call fails.
    # -m 8222 opens the monitoring port the healthcheck below uses.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - nats-data:/data
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686" # the UI you actually look at
      - "4317:4317" # OTLP over gRPC, where the services send spans
    # Deliberately no healthcheck: the image has no shell, wget or curl to run
    # one with. Nothing depends on Jaeger being up either - a service that
    # cannot reach the collector drops spans and keeps serving traffic, which
    # is the correct trade for observability.
    restart: unless-stopped

  # Scrapes /metrics from every service every 5 seconds. That interval is far
  # more frequent than production would use; a demo you have to wait a minute
  # to see react is not a demo.
  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      # Needed by Grafana's "Explore" view to query the raw series.
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # The image is distroless - no shell, no wget - so the healthcheck runs
    # Prometheus' own binary, the same trick the Rust services use.
    healthcheck:
      test: ["CMD", "promtool", "check", "healthy", "--url=http://localhost:9090"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.3
    environment:
      # Anonymous admin access. Correct for a local demo, catastrophic anywhere
      # else - there is no login page at all with this set.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Opens straight on the dashboard rather than an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/orders.json
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      # Datasource and dashboards are provisioned from version control, so a
      # fresh volume comes up fully configured and DevRemove.cmd cannot destroy
      # a dashboard someone spent an afternoon on.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-devdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devuser} -d ${POSTGRES_DB:-devdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      # A named volume survives DevDelete.cmd, so data outlives a restart.
      # DevRemove.cmd is the one that deletes it.
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  nats-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
