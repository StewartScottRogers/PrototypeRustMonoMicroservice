[package]
name = "worker-service"
description = "Consumes order commands from JetStream, does the work once, and publishes the completion event."
# Each crate carries its own version number instead of inheriting the workspace
# one. release-plz bumps only the crates whose files actually changed, so
# worker-service can reach 0.2.0 while echo-service stays at 0.1.0. Note that
# inheritance is per key: every other line here still says `key.workspace = true`,
# meaning "take this value from [workspace.package] in the root Cargo.toml".
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-nats.workspace = true
futures.workspace = true
messaging-core.workspace = true
metrics.workspace = true
serde_json.workspace = true
service-core.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
