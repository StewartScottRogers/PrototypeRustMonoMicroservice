[package]
name = "messaging-core"
description = "Shared NATS/JetStream plumbing and the message contracts every service agrees on."
# Each crate carries its own version number instead of inheriting the workspace
# one. release-plz bumps only the crates whose files actually changed, so
# worker-service can reach 0.2.0 while echo-service stays at 0.1.0. Note that
# inheritance is per key: every other line here still says `key.workspace = true`,
# meaning "take this value from [workspace.package] in the root Cargo.toml".
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-nats.workspace = true
chrono.workspace = true
futures.workspace = true
opentelemetry.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true
