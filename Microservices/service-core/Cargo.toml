[package]
name = "service-core"
description = "Health probes and telemetry setup shared by every service in the workspace."
# Each crate carries its own version number instead of inheriting the workspace
# one. release-plz bumps only the crates whose files actually changed, so
# worker-service can reach 0.2.0 while echo-service stays at 0.1.0. Note that
# inheritance is per key: every other line here still says `key.workspace = true`,
# meaning "take this value from [workspace.package] in the root Cargo.toml".
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true
