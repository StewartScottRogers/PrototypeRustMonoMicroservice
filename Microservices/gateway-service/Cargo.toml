# A Cargo.toml describes one crate. `[package]` is its identity, `[dependencies]`
# is what it may `use`. Rust has no global include path: a crate can only see
# crates listed here.
[package]
name = "gateway-service"
description = "Front door for the stack: takes a request and calls echo-service over the internal network."
# `x.workspace = true` inherits the value from the root Cargo.toml, so version
# and licence are set once for the whole repository instead of per crate.
# Each crate carries its own version number instead of inheriting the workspace
# one. release-plz bumps only the crates whose files actually changed, so
# worker-service can reach 0.2.0 while echo-service stays at 0.1.0. Note that
# inheritance is per key: every other line here still says `key.workspace = true`,
# meaning "take this value from [workspace.package] in the root Cargo.toml".
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# Inherits the shared lint levels (for example: `unwrap()` is denied outside
# tests). Without this line the crate would silently opt out of them.
[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
db-core.workspace = true
messaging-core.workspace = true
metrics.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid.workspace = true
# The shared library crate in this workspace. Cargo resolves it by path, so
# there is no publishing step between changing it and using the change here.
service-core.workspace = true
tokio.workspace = true
# The cross-origin layer, so a browser page served from another port may
# call this gateway. See the comment on the layer itself in main.rs.
tower-http.workspace = true
tracing.workspace = true

# Only compiled for `cargo test`, never linked into the shipped binary.
[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true
