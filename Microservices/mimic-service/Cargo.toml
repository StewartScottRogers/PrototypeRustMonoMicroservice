[package]
name = "mimic-service"
description = "Serves a live control-room mimic of this stack, driven by a message-bus tap, Prometheus, and the NATS monitoring endpoint."
# Each crate carries its own version number instead of inheriting the workspace
# one. release-plz bumps only the crates whose files actually changed, so
# worker-service can reach 0.2.0 while echo-service stays at 0.1.0. Note that
# inheritance is per key: every other line here still says `key.workspace = true`,
# meaning "take this value from [workspace.package] in the root Cargo.toml".
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# The "ws" feature adds the WebSocket upgrade this service uses to push changes
# to the browser. Enabled here rather than at the workspace root on purpose:
# turning it on centrally would enlarge every other service image for a feature
# only this one uses.
axum = { workspace = true, features = ["ws"] }
chrono.workspace = true
# `StreamExt::next`, for reading messages off a JetStream consumer.
futures.workspace = true
messaging-core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
service-core.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
