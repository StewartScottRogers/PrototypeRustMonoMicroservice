<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Mimic — Order Platform</title>
<style>
  /* A control room commits to one visual world, so every colour is painted
     explicitly rather than inherited from whatever is framing the page. */
  :root {
    --void:#05080b; --ground:#080d12; --panel:#0d151c; --panel-2:#101a22;
    --edge:#22333e; --edge-hi:#334c5c;
    --ink:#c7d8e4; --dim:#6d8496; --far:#42555f;
    --ok:#2fd98a; --warn:#ffb020; --fail:#ff4a4a; --unknown:#5a6b78;
    --sync:#34c3e0; --async:#b07cff;
    --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}

  /* ---- fitting the screen ----
     This panel is read on a laptop and on a television across a room, and the
     drawing is one fixed-proportion picture either way. So the page is a column
     that owns the whole viewport, and the drawing takes whatever is left after
     the status strip and the caption - constrained by *height* as well as
     width, because a picture that fills the width of a 4K screen is far taller
     than that screen and would have to be scrolled to be seen.

     There is deliberately no maximum width. The old one stopped at 96rem, so
     everything past about 1536 pixels was black margin.

     `dvh` rather than `vh` so a mobile browser's disappearing toolbar does not
     leave the drawing cropped by the height of a toolbar that is not there. */
  html,body{height:100%}
  body{background:var(--void);color:var(--ink);font-family:var(--mono);margin:0;
       padding:clamp(.5rem,1.2vh,1.25rem) clamp(.5rem,1vw,1.25rem);
       -webkit-font-smoothing:antialiased;
       min-height:100dvh;display:flex;flex-direction:column}
  .shell{flex:1;min-height:0;display:flex;flex-direction:column;margin:0 auto;width:100%}

  /* Type that scales with the screen. The middle term of each clamp is tied to
     the viewport, so the wording beside a drawing four times larger grows with
     it rather than staying 11-pixel type in the corner of a television. */
  .strip{display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;justify-content:space-between;align-items:baseline;
         padding:.3rem .4rem .7rem;font-size:clamp(.7rem,.55vw,1.15rem);
         letter-spacing:.16em;text-transform:uppercase;color:var(--far)}
  .strip b{color:var(--dim);font-weight:500}
  #connection{color:var(--ok)}
  #connection.stale{color:var(--warn)}
  /* Positioned, because the hover panel below is placed against it. */
  .bezel{position:relative;background:var(--ground);border:1px solid var(--edge);
         box-shadow:0 0 0 1px #000 inset,0 24px 60px -30px #000;
         padding:clamp(.35rem,.5vw,1rem);
         flex:1;min-height:0;display:flex;flex-direction:column}

  /* The hover panel. One component, two jobs:

       on a reading  the name, the unit, and what the number counts
       on a box      what the thing is, what it does here, and where to read
                     more about it

     Deliberately not the browser's own `title` tooltip: that takes about a
     second to appear, cannot be styled, and would arrive in the operating
     system's font in the middle of a control room.

     It is *not* `pointer-events:none`, which is what a tooltip usually wants.
     The box panels carry links, and a link nobody can reach is decoration. The
     script gives the pointer a moment to travel from the box into the panel
     instead, and the panel cancels its own closing timer on the way in. */
  /* Sized against the viewport like everything else here. A panel in fixed
     pixels would be a postage stamp beside a drawing scaled up four times on a
     television, and the whole point of it is that it can be read. */
  .tip{position:absolute;z-index:5;max-width:min(34ch,80vw);
       background:var(--panel-2);border:1px solid var(--edge-hi);
       box-shadow:0 14px 34px -14px #000;padding:clamp(.5rem,.6vw,1rem) clamp(.6rem,.75vw,1.2rem);
       font-size:clamp(.72rem,.62vw,1.1rem);line-height:1.55}
  .tip[hidden]{display:none}
  .tip-t{color:var(--ink);font-size:1.18em;letter-spacing:.02em}
  .tip-k{color:var(--far);letter-spacing:.14em;text-transform:uppercase;font-size:.78em;
         margin-bottom:.15rem}
  .tip-v{font-size:1.45em;margin:.2rem 0 .25rem;color:var(--ink)}
  .tip-v[hidden]{display:none}
  .tip-v span{font-size:.62em;color:var(--far);letter-spacing:.08em}
  .tip-n{color:var(--dim);text-wrap:pretty;margin-top:.35rem}
  /* Links are stacked rather than run together: each is a different place to
     go, and a row of them reads as one sentence with slashes in it. */
  .tip-ls{margin-top:.5rem;border-top:1px solid var(--edge);padding-top:.4rem;
          display:flex;flex-direction:column;gap:.2rem}
  .tip-ls[hidden]{display:none}
  .tip-ls a{color:var(--sync);text-decoration:none;font-size:.92em}
  .tip-ls a:hover,.tip-ls a:focus{text-decoration:underline}
  .tip-ls a::after{content:" ↗";color:var(--far)}
  /* The scroller only ever scrolls on a window too narrow to read the drawing
     at all. The floor is 40rem rather than the old 72rem: between those two
     widths the drawing now shrinks to fit instead of growing a scrollbar. */
  /* Column, not row: the caption is a sibling of the figure rather than a child
     of it, so a row here puts the prose down the side of the drawing. */
  .scroller{overflow-x:auto;flex:1;min-height:0;display:flex;flex-direction:column}
  figure{margin:0;flex:1;min-width:40rem;min-height:0;
         display:flex;flex-direction:column;align-items:center;justify-content:center}

  /* The drawing takes the height it is given and derives its own width from
     the viewBox proportions, so the element *is* the picture rather than a
     wider box with the picture floating in the middle of it.

     Which way round matters. `width:100%; height:auto` was the obvious
     spelling and is wrong on a wide screen: `aspect-ratio` sets the height,
     `max-height` then clamps it, and the width - being explicitly 100% - stays
     where it was. Measured on a 2691-pixel screen that produced an element
     2622 by 1202 for a picture whose proportions are 1224 by 800. Deriving the
     width instead leaves nothing to disagree about, and `max-width` still
     takes over on a window too narrow for the height to be the binding
     constraint. */
  svg{display:block;width:auto;height:100%;max-width:100%;margin:0 auto;
      aspect-ratio:1224/800}

  figcaption{margin:clamp(.5rem,1.2vh,1.4rem) auto 0;max-width:80ch;
             font-size:clamp(.7rem,.62vw,1.15rem);line-height:1.7;
             color:var(--dim);text-align:center;text-wrap:pretty;flex:none}
  figcaption b{color:var(--ink);font-weight:500}
  /* A line that just carried a message. Brightening and thickening is
     length-independent, which matters because most connectors here are 32 to 52
     units long against a 1500-unit canvas - a travelling dot on those would be a
     twitch, not a journey. */
  .lit{stroke-width:2.8 !important;filter:brightness(1.9)}

  /* The second kind of liveness, and it must not look like the first.
     `.lit` means "a message crossed this line, milliseconds ago" — the panel
     saw it happen, on the bus. `.absorbing` means "this was still flowing when
     we last asked", and the last ask was up to two seconds back, derived from a
     counter rather than witnessed.
     Those are different claims about different evidence. A steady crawl reads
     as a condition; a flash reads as an event. Making them identical would be
     the first thing on this panel that is not true. */
  .absorbing{filter:brightness(1.6)}

  @media (prefers-reduced-motion:no-preference){
    /* A one-second heartbeat on the live indicator, so a frozen panel is
       obvious without reading a timestamp. */
    #beat{animation:beat 1s steps(1,end) infinite}
    @keyframes beat{50%{opacity:.2}}

    .lit{transition:stroke-width .12s ease-out,filter .12s ease-out}

    /* The asynchronous lines already carry a dash pattern, so flowing them
       costs no new elements at all - just an offset animation. */
    .flowing{animation:march .6s linear infinite}
    @keyframes march{to{stroke-dashoffset:-24}}

    /* Four times slower than `march`, deliberately. Telemetry is a condition
       being reported, not an event being witnessed, and the eye reads the
       difference in speed before it reads any legend. */
    .absorbing{animation:crawl 2.4s linear infinite}
    @keyframes crawl{to{stroke-dashoffset:-24}}

    /* The synchronous line has no dash pattern to march, so the same claim is
       made by breathing instead - at the same 2.4 second period, so it reads as
       the same *kind* of statement as the crawling telemetry lines even though
       the mechanism has to differ. */
    .line-sync.absorbing{animation:breathe 2.4s ease-in-out infinite}
    @keyframes breathe{50%{filter:brightness(2.2)}}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="strip">
    <span>Order Platform &middot; <b>Live Mimic</b></span>
    <!--
      Three separate claims, because they have three separate failure modes and
      collapsing any pair produces a panel that is confidently wrong about the
      half that still works:

        lamps      the sampled data is fresh        (from the server's own clock)
        flow       the message bus tap is connected (not: messages are arriving)
        connection this browser is being told       (from the watchdog below)

      A lit wire beside a grey lamp is correct behaviour, and a reader has to be
      able to see why rather than concluding the whole panel is broken.
    -->
    <span>Lamps <b id="age-lamps">&mdash;</b> &middot; Flow <b id="age-flow">&mdash;</b>
      &middot; <span id="connection"><span id="beat">&#9679;</span> LIVE</span></span>
  </div>

  <div class="bezel">
    <!-- Filled and placed from script; `aria-live` so a screen reader announces
         it when a keyboard user tabs onto a reading, which is the same moment a
         pointer user would see it appear. -->
    <div class="tip" id="tip" role="status" aria-live="polite" hidden>
      <div class="tip-k" id="tip-kind"></div>
      <div class="tip-t" id="tip-title"></div>
      <div class="tip-v" id="tip-figure"><b id="tip-value">&mdash;</b> <span id="tip-unit"></span></div>
      <div class="tip-n" id="tip-note"></div>
      <div class="tip-ls" id="tip-links"></div>
    </div>

    <div class="scroller">
      <figure>
        <svg viewBox="0 0 1224 800" role="img"
             aria-label="Live mimic of the order platform, read left to right and then top to bottom. Band one: clients post an order to the gateway service, which writes the order and an outbox row to PostgreSQL in one transaction, and the outbox relay polls that table. The gateway also calls the echo service synchronously as a simple example. Band two: the relay publishes to the command stream on the NATS JetStream broker, one worker replica takes each command, and the worker publishes to the event stream, which every subscriber reads a copy of, so both the notifier and the audit service react. Redis holds idempotency keys and repeatedly failing messages are parked on the dead-letter stream. Band three: Prometheus, Grafana and Jaeger receive telemetry from every service. Each live rate or depth is shown as a small figure attached to the thing it measures. Pausing the pointer on a figure names it in full; pausing on any box explains what that thing is and links to its documentation. Every box is reachable with the Tab key, and Enter follows its first link.">
          <defs>
            <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#34c3e0"/></marker>
            <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#b07cff"/></marker>
            <marker id="arrow-quiet" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#5c7382"/></marker>
          </defs>

          <style>
            .box      { fill:#0d151c; stroke:#334c5c; stroke-width:1.4; }
            .box-soft { fill:#0a1118; stroke:#22333e; stroke-width:1.2; }
            .box-tag  { fill:#0a1118; stroke:#334c5c; stroke-width:1.2; stroke-dasharray:3 3; }
            .name     { font-family:inherit; font-size:14px; fill:#c7d8e4; letter-spacing:.04em; }
            .sub      { font-family:inherit; font-size:10.5px; fill:#6d8496; }
            .detail   { font-family:inherit; font-size:10.5px; fill:#6d8496; }
            .band     { font-family:inherit; font-size:11px; fill:#6d8496; letter-spacing:.2em; }
            .band-n   { font-family:inherit; font-size:11px; fill:#34c3e0; letter-spacing:.2em; }
            .edge-lbl { font-family:inherit; font-size:10px; fill:#5c7382; letter-spacing:.02em; }
            .line-sync  { stroke:#34c3e0; stroke-width:1.6; fill:none; }
            .line-async { stroke:#b07cff; stroke-width:1.6; fill:none; stroke-dasharray:7 5; }
            .line-quiet { stroke:#5c7382; stroke-width:1.2; fill:none; stroke-dasharray:2 4; }
            .rule     { stroke:#1a2831; stroke-width:1; }
            .tag-txt  { font-family:inherit; font-size:12px; fill:#34c3e0; letter-spacing:.1em; }
            .read-unt { font-family:inherit; font-size:10px; fill:#42555f; }

            /* ---- the inline readings ----
               Each number sits on the lower edge of the thing it measures, so
               "5.07" is read as a property of the notifier rather than as the
               fifth row of a table that has to be matched back to a box.
               56 by 20 units holds "1714" or "5.07" and nothing else; the name,
               the unit and the sentence explaining it live in the hover panel,
               which is the trade that lets the badge be this small.

               It stands out by being brighter than its host, not larger: a fill
               a step above the node's own, and a border in the reading's colour
               - cyan for a synchronous count, violet for one carried by the
               message bus, matching the arrows.

               Neither `stroke` here nor `fill` on .rd-val, deliberately. Both
               are painted from script as readings arrive, and a class rule
               overrides a presentation attribute - which is exactly how the
               amber warning colour on the old instrument tiles was silently
               lost. */
            /* ---- the boxes ----
               Each box is a group rather than a loose rectangle and two labels,
               so its border, its fill and its name are one hover target: a
               reader pointing at the word "Grafana" is pointing at Grafana.

               Brightened on hover rather than restroked, because the worker's
               border already carries its health and a class rule would paint
               over an amber or red one at exactly the moment somebody is
               pointing at it to find out what is wrong. */
            .nd       { cursor:help; }
            .nd:hover, .nd:focus { filter:brightness(1.35); }
            .nd:focus { outline:none; }

            .rd       { cursor:help; }
            .rd-box   { fill:#16232e; stroke-width:1.1; }
            .rd-val   { font-family:inherit; font-size:13px; letter-spacing:.02em; }
            .rd:hover .rd-box, .rd:focus .rd-box { fill:#1e3241; stroke-width:1.8; }
            .rd:focus { outline:none; }
          </style>

          <!-- ============ ALARM BANNER ============ -->
          <rect id="alarm-box" x="40" y="20" width="1136" height="52" rx="2"
                fill="#0f1a14" stroke="#2fd98a" stroke-width="1.4"/>
          <circle id="alarm-led" cx="70" cy="46" r="7" fill="#2fd98a"/>
          <text id="alarm-title" x="96" y="51" font-size="12" fill="#2fd98a" letter-spacing="2.4">ALL CLEAR</text>
          <line x1="212" y1="30" x2="212" y2="62" class="rule"/>
          <text id="alarm-text" x="234" y="51" font-size="13" fill="#c7d8e4">no active alarms</text>
          <text id="alarm-count" x="1152" y="51" font-size="11" fill="#6d8496" text-anchor="end">0 ACTIVE</text>

          <!-- ================================================================
               BAND 1 — accept and store. Reads left to right.
               ================================================================ -->
          <text class="band-n" x="48" y="106">1</text>
          <text class="band" x="70" y="106">ACCEPT AND STORE &#183; SYNCHRONOUS</text>
          <line x1="392" y1="102" x2="1060" y2="102" class="rule"/>

          <!-- clients -->
          <g class="nd" tabindex="0" data-what="clients">
            <rect class="box-soft" x="48" y="136" width="150" height="66" rx="2"/>
            <text class="name" x="123" y="167" text-anchor="middle">Clients</text>
            <text class="sub"  x="123" y="185" text-anchor="middle">curl or DevDemo.cmd</text>
          </g>

          <path id="edge-clients-gateway" class="line-sync" d="M198 169 H244" marker-end="url(#arrow-sync)"/>
          <text class="edge-lbl" x="221" y="128" text-anchor="middle">place an order</text>

          <!-- gateway -->
          <g class="nd" tabindex="0" data-what="gateway">
            <rect class="box" x="248" y="136" width="196" height="66" rx="2"/>
            <circle id="led-gateway" cx="428" cy="150" r="6" fill="#5a6b78"/>
            <text class="name" x="336" y="167" text-anchor="middle">Gateway service</text>
            <text id="txt-gateway" class="detail" x="336" y="185" text-anchor="middle">&mdash;</text>
          </g>

          <g class="rd" tabindex="0" role="img"
             data-title="Orders accepted" data-unit="per second"
             data-note="Orders the gateway service took in and committed, averaged over the last fifteen seconds.">
            <rect class="rd-box" id="box-g-accepted" data-hue="#34c3e0" stroke="#34c3e0"
                  x="260" y="192" width="56" height="20" rx="2"/>
            <text class="rd-val" id="g-accepted" data-hue="#34c3e0" fill="#34c3e0"
                  x="288" y="206" text-anchor="middle">&mdash;</text>
          </g>

          <path id="edge-gateway-postgres" class="line-sync" d="M444 169 H489" marker-end="url(#arrow-sync)"/>
          <text class="edge-lbl" x="466" y="128" text-anchor="middle">one transaction</text>

          <!-- postgresql -->
          <g class="nd" tabindex="0" data-what="postgres">
            <rect class="box" x="493" y="136" width="196" height="66" rx="2"/>
            <circle id="led-postgres" cx="673" cy="150" r="6" fill="#5a6b78"/>
            <text class="name" x="581" y="167" text-anchor="middle">PostgreSQL</text>
            <text id="txt-postgres" class="detail" x="581" y="185" text-anchor="middle">&mdash;</text>
          </g>

          <path id="edge-postgres-relay" class="line-sync" d="M689 169 H734" marker-end="url(#arrow-sync)"/>
          <text class="edge-lbl" x="711" y="128" text-anchor="middle">poll</text>

          <!-- outbox relay -->
          <g class="nd" tabindex="0" data-what="relay">
            <rect class="box" x="738" y="136" width="196" height="66" rx="2"/>
            <circle id="led-relay" cx="918" cy="150" r="6" fill="#5a6b78"/>
            <text class="name" x="826" y="167" text-anchor="middle">Outbox relay</text>
            <text id="txt-relay" class="detail" x="826" y="185" text-anchor="middle">&mdash;</text>
          </g>

          <g class="rd" tabindex="0" role="img"
             data-title="Outbox rows published" data-unit="per second"
             data-note="Committed outbox rows the relay has put on the message bus, averaged over the last fifteen seconds. It should track the accepted rate; a lasting gap means the relay is behind.">
            <rect class="rd-box" id="box-g-relayed" data-hue="#b07cff" stroke="#b07cff"
                  x="750" y="192" width="56" height="20" rx="2"/>
            <text class="rd-val" id="g-relayed" data-hue="#b07cff" fill="#b07cff"
                  x="778" y="206" text-anchor="middle">&mdash;</text>
          </g>

          <path id="edge-relay-tag" class="line-async" d="M934 169 H986" marker-end="url(#arrow-async)"/>

          <!-- continuation tag: leaves band 1 -->
          <g class="nd" tabindex="0" data-what="tag">
            <rect class="box-tag" x="990" y="146" width="70" height="46" rx="2"/>
            <text class="tag-txt" x="1025" y="175" text-anchor="middle">&#9660; A</text>
          </g>

          <!-- the synchronous side example, hanging below the gateway -->
          <path id="edge-gateway-echo" class="line-sync" d="M336 202 V244" marker-end="url(#arrow-sync)"/>
          <text class="edge-lbl" x="348" y="226">a simpler example</text>

          <g class="nd" tabindex="0" data-what="echo">
            <rect class="box-soft" x="248" y="248" width="196" height="56" rx="2"/>
            <circle id="led-echo" cx="428" cy="262" r="6" fill="#5a6b78"/>
            <text class="name" x="336" y="274" text-anchor="middle">Echo service</text>
            <text id="txt-echo" class="detail" x="336" y="292" text-anchor="middle">&mdash;</text>
          </g>

          <!-- ================================================================
               BAND 2 — the broker. Reads left to right, fans out downward.
               ================================================================ -->
          <text class="band-n" x="48" y="352">2</text>
          <text class="band" x="70" y="352">HAND OFF THROUGH THE BROKER &#183; NATS JETSTREAM</text>
          <g class="nd" tabindex="0" data-what="nats">
            <circle id="led-nats" cx="500" cy="348" r="6" fill="#5a6b78"/>
            <text id="txt-nats" class="detail" x="516" y="352">&mdash;</text>
          </g>
          <line x1="620" y1="348" x2="1060" y2="348" class="rule"/>

          <!-- continuation tag: enters band 2 -->
          <g class="nd" tabindex="0" data-what="tag">
            <rect class="box-tag" x="48" y="378" width="70" height="46" rx="2"/>
            <text class="tag-txt" x="83" y="407" text-anchor="middle">A &#9654;</text>
          </g>

          <path id="edge-tag-commands" class="line-async" d="M118 401 H150" marker-end="url(#arrow-async)"/>

          <!-- command stream -->
          <g class="nd" tabindex="0" data-what="commands">
            <rect class="box" x="154" y="372" width="218" height="66" rx="2"/>
            <text class="name" x="263" y="399" text-anchor="middle">Command stream</text>
            <text class="sub"  x="263" y="417" text-anchor="middle">one shared consumer</text>
          </g>

          <g class="rd" tabindex="0" role="img"
             data-title="Waiting for the worker" data-unit="messages"
             data-note="Commands sitting on the stream that no worker has claimed yet. Past 100 the worker is drawn as backed up rather than healthy.">
            <rect class="rd-box" id="box-g-queue" data-hue="#34c3e0" stroke="#34c3e0"
                  x="166" y="428" width="56" height="20" rx="2"/>
            <text class="rd-val" id="g-queue" data-hue="#34c3e0" fill="#34c3e0"
                  x="194" y="442" text-anchor="middle">&mdash;</text>
          </g>

          <path id="edge-commands-worker" class="line-async" d="M372 405 H422" marker-end="url(#arrow-async)"/>
          <text class="edge-lbl" x="397" y="364" text-anchor="middle">one takes it</text>

          <!-- worker
               Its two readings sit on the *top* edge, alone among the badges on
               this drawing. Everything else wears its reading on the lower edge,
               but the worker is the one node with lines leaving underneath it -
               to Redis and to the dead-letter stream - and a badge there would
               sit on top of them. -->
          <g class="nd" tabindex="0" data-what="worker">
            <rect id="node-worker" class="box" x="426" y="372" width="196" height="66" rx="2"/>
            <circle id="led-worker" cx="606" cy="386" r="6" fill="#5a6b78"/>
            <text class="name" x="514" y="399" text-anchor="middle">Worker</text>
            <text id="txt-worker" class="detail" x="514" y="417" text-anchor="middle">&mdash;</text>
          </g>

          <g class="rd" tabindex="0" role="img"
             data-title="Orders processed" data-unit="per second"
             data-note="Commands the worker replicas finished, averaged over the last fifteen seconds. Both replicas share one durable consumer name, so this is the two of them combined rather than each.">
            <rect class="rd-box" id="box-g-processed" data-hue="#b07cff" stroke="#b07cff"
                  x="438" y="362" width="56" height="20" rx="2"/>
            <text class="rd-val" id="g-processed" data-hue="#b07cff" fill="#b07cff"
                  x="466" y="376" text-anchor="middle">&mdash;</text>
          </g>

          <g class="rd" tabindex="0" role="img"
             data-title="Slowest one in a hundred" data-unit="milliseconds"
             data-note="The ninety-ninth percentile of worker processing time over five minutes: ninety-nine orders in a hundred finish faster than this. Past 400 milliseconds the worker is drawn as degraded.">

               here rather than only in the walkthrough, because someone
               watching a line light up is not reading the walkthrough.
               The distinction in the second line is the one that matters most:
               a flash is something the panel *saw*, a crawl is something it was
               *told* about a second or two ago. -->

      <figcaption>
        Every lamp, number and moving line here is read from the running system,
        not typed in. This panel is a subscriber on the same message bus the
        services use, so a line lights the moment a message is published rather
        than whenever a measurement next happens to be taken.
        Watch the difference the platform exists to teach: one command lights a
        single line into the <b>worker</b>, because the workers share one durable
        consumer name and split the load. One event lights the
        <b>notifier</b> and <b>audit</b> lines <em>together</em>, because those two
        hold separate names and each receives its own copy.

<script>
  // ===========================================================================
  // The panel is told, not asked.
  //
  // This page used to poll once a second, which meant nothing on screen could
  // ever be newer than the last request. It now holds one socket open and the
  // service pushes as things happen. Three kinds of message arrive:
  //
  //   frame  the whole picture. On connect, and whenever it changes.
  //   pulse  traffic crossed the message bus. Readings are absolute values;
  //          edges are the lines to light.
  //   tick   nothing changed, and here is how fresh each claim is.
  //
  // The one recovery rule: apply a message only if its sequence number is
  // greater than the last one seen. Because readings are absolute rather than
  // increments, a browser that slept, lagged, reconnected or met a restarted
  // server all recover the same way - the next message puts it right.
  // ===========================================================================

  const COLOURS = { healthy:"#2fd98a", degraded:"#ffb020", down:"#ff4a4a", unknown:"#5a6b78" };
  const ALARM_GROUND = { healthy:"#0f1a14", degraded:"#241703", down:"#2a0f0f", unknown:"#141b21" };

  // A line stays lit this long after a message crossed it.
  const LIT_MILLISECONDS = 340;
  // How long the whole staggered command path takes to travel, left to right.
  const STAGGER_MILLISECONDS = 40;
  // Silence longer than this means the feed is gone, whatever the socket says.
  const WATCHDOG_MILLISECONDS = 3000;
  // Sampled data older than this stops being described as live.
  const LAMPS_FRESH_MILLISECONDS = 6000;

  // The lines a command travels, in order. Six of them, ending at exactly one
  // line into the worker - because one worker takes each command.
  const COMMAND_EDGES = ["edge-clients-gateway", "edge-gateway-postgres", "edge-postgres-relay",
                         "edge-relay-tag", "edge-tag-commands", "edge-commands-worker"];
  // One publish, two subscribers, lit together rather than in sequence. That
  // simultaneity is the whole difference between eventing and messaging.
  const EVENT_EDGES = ["edge-worker-events", "edge-events-notifier", "edge-events-audit"];
  const DEAD_LETTER_EDGES = ["edge-worker-deadletter"];
  // The worker claims an idempotency key in Redis for *every* command it takes,
  // so when the tap sees a command that claim genuinely happened. Same
  // inference the staggered path above already makes, and the reason this line
  // can flash on the bus rather than waiting for a counter.
  const REDIS_EDGES = ["edge-worker-redis"];

  // Which reading says each telemetry line is carrying anything. These are
  // rates from Prometheus, reconciled every couple of seconds — not events seen
  // on the bus — which is why they drive a slow crawl rather than a flash.
  const ABSORBING = [
    { edge: "edge-telemetry-rail", reading: "g-prom-flow" },
    { edge: "edge-telemetry-prometheus", reading: "g-prom-flow" },
    { edge: "edge-telemetry-jaeger", reading: "g-jaeger-flow" },
    { edge: "edge-prometheus-grafana", reading: "g-grafana-flow" },
    // The synchronous call to the echo service. It crosses no message bus, so
    // the tap is blind to it and a counter is the only evidence available -
    // which puts it in this list rather than among the flashing lines, even
    // though it is a request and reply rather than telemetry.
    { edge: "edge-gateway-echo", reading: "g-echo-flow" },
  ];
  // The two longest lines on the drawing, and the two that carry the lesson, so
  // they are the two that get a travelling dot rather than only a flash.
  const DOTTED_EDGES = ["edge-events-notifier", "edge-events-audit"];

  const byId = (id) => document.getElementById(id);
  const motionAllowed = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let socket = null;
  let lastSeq = -1;
  let epoch = null;
  let watchdog = null;
  let failedOpens = 0;
  let backoff = 500;
  let sampling = null;          // the polling fallback, if it ever engages
  const litUntil = new Map();   // edge identifier -> when its flash expires

  // ---------------------------------------------------------------------------
  // Painting
  // ---------------------------------------------------------------------------

  function paintNodes(nodes) {
    for (const node of nodes) {
      const lamp = byId("led-" + node.id);
      if (lamp) lamp.setAttribute("fill", COLOURS[node.status] || COLOURS.unknown);

      const detail = byId("txt-" + node.id);
      if (detail) {
        detail.textContent = node.detail;
        detail.setAttribute("fill", node.status === "healthy" ? "#6d8496" : COLOURS[node.status]);
      }

      // The outline of the worker carries its state too, so a degraded block
      // reads at a glance rather than needing the lamp to be found first.
      if (node.id === "worker") {
        const box = byId("node-worker");
        if (box) box.setAttribute("stroke", node.status === "healthy" ? "#334c5c" : COLOURS[node.status]);
      }
    }
  }

  function paintGauges(gauges) {
    for (const reading of gauges) {
      const value = byId(reading.id);
      if (!value) continue;
      value.textContent = reading.value;
      value.setAttribute("fill", reading.warn ? COLOURS.degraded : value.getAttribute("data-hue"));
      // The badge's border carries the same warning as its number. Back to the
      // reading's own hue rather than to one shared grey, because the border is
      // what says whether this count travelled the message bus or a call.
      const badge = byId("box-" + reading.id);
      if (badge) {
        badge.setAttribute("stroke", reading.warn ? COLOURS.degraded : badge.getAttribute("data-hue"));
      }
    }
    showAbsorbing(gauges);

    // A reading on screen inside the hover panel has just gone stale. Only a
    // reading: a box's description does not change when a number does.
    if (openTarget && openTarget.classList.contains("rd")) fillTip(openTarget);
  }

  function paintAlarms(alarms) {
    // Ranked, so an "unknown" alarm cannot fall through to the healthy colour.
    // A banner that says something is wrong while painting itself green is the
    // worst of both: it is noticed, and then dismissed.
    const RANK = { healthy: 0, unknown: 1, degraded: 2, down: 3 };
    const worst = alarms.reduce(
      (carried, alarm) => (RANK[alarm.severity] > RANK[carried] ? alarm.severity : carried),
      "healthy");

    const box = byId("alarm-box"), lamp = byId("alarm-led"),
          title = byId("alarm-title"), text = byId("alarm-text"), count = byId("alarm-count");

    if (alarms.length === 0) {
      box.setAttribute("stroke", COLOURS.healthy);
      box.setAttribute("fill", ALARM_GROUND.healthy);
      lamp.setAttribute("fill", COLOURS.healthy);
      title.setAttribute("fill", COLOURS.healthy);
      title.textContent = "ALL CLEAR";
      text.textContent = "no active alarms";
      text.setAttribute("fill", "#c7d8e4");
      count.textContent = "0 ACTIVE";
    } else {
      const hue = COLOURS[worst] || COLOURS.degraded;
      box.setAttribute("stroke", hue);
      box.setAttribute("fill", ALARM_GROUND[worst] || ALARM_GROUND.degraded);
      lamp.setAttribute("fill", hue);
      title.setAttribute("fill", hue);
      title.textContent = worst === "down" ? "ALARM" : "WARNING";
      text.textContent = alarms[0].text;
      text.setAttribute("fill", "#e6eef4");
      count.textContent = alarms.length + " ACTIVE";
    }
  }

  function paint(state) {
    paintNodes(state.nodes);
    paintGauges(state.gauges);
    paintAlarms(state.alarms);
  }

  // ---------------------------------------------------------------------------
  // Motion
  //
  // Every gate below is load-bearing rather than polish. A hidden tab painting
  // animations, or five hundred dots for five hundred orders, is how a panel
  // becomes the reason a laptop fan spins up.
  // ---------------------------------------------------------------------------

  function light(edgeId) {
    const line = byId(edgeId);
    if (!line) return;

    line.classList.add("lit");
    litUntil.set(edgeId, Date.now() + LIT_MILLISECONDS);

    if (motionAllowed && line.classList.contains("line-async")) {
      line.classList.add("flowing");
    }

    window.setTimeout(() => {
      // Another message may have arrived meanwhile and pushed the expiry out.
      if ((litUntil.get(edgeId) || 0) <= Date.now()) {
        line.classList.remove("lit", "flowing");
        litUntil.delete(edgeId);
      }
    }, LIT_MILLISECONDS + 20);
  }

  /// Sends one dot along a real path, using the path itself as the route.
  ///
  /// `mpath` references the drawn element, so the geometry is never duplicated
  /// into a stylesheet that then has to be kept in step by hand. No rotation:
  /// these are right-angled polylines and a rotating marker snaps at each corner.
  function sendDot(edgeId) {
    if (!motionAllowed) return;
    const line = byId(edgeId);
    if (!line) return;

    const svg = line.ownerSVGElement;
    const namespace = "http://www.w3.org/2000/svg";

    const dot = document.createElementNS(namespace, "circle");
    dot.setAttribute("r", "4");
    dot.setAttribute("fill", "#d9c2ff");
    // Decorative. The drawing carries a written description for anyone who
    // cannot see it, and moving dots must not enter that description.
    dot.setAttribute("aria-hidden", "true");

    const motion = document.createElementNS(namespace, "animateMotion");
    motion.setAttribute("dur", "0.5s");
    motion.setAttribute("fill", "remove");

    const route = document.createElementNS(namespace, "mpath");
    route.setAttribute("href", "#" + edgeId);

    motion.appendChild(route);
    dot.appendChild(motion);
    svg.appendChild(dot);

    motion.addEventListener("endEvent", () => dot.remove());
    // A tab hidden mid-flight never fires endEvent, so remove it regardless.
    window.setTimeout(() => dot.remove(), 900);
  }

  function animate(edges) {
    if (document.visibilityState !== "visible") return;

    const touched = new Set(edges.map((edge) => edge.id));

    // A command path is staggered left to right. That is honest as well as
    // legible: the tap observes the relay's publish, so the upstream hops
    // genuinely did happen a moment earlier.
    if (touched.has("edge-commands-worker")) {
      COMMAND_EDGES.forEach((edgeId, position) => {
        window.setTimeout(() => light(edgeId), position * STAGGER_MILLISECONDS);
      });
    }

    // An event lights all three of its lines from the same message, so the two
    // subscriber lines start together. One event, two copies, at once.
    if (touched.has("edge-worker-events")) {
      EVENT_EDGES.forEach(light);
      DOTTED_EDGES.forEach(sendDot);
    }

    DEAD_LETTER_EDGES.forEach((edgeId) => {
      if (touched.has(edgeId)) light(edgeId);
    });

    // Lit at the end of the staggered path, because that is when it happens:
    // the worker claims the key as it takes the command, not before.
    if (touched.has("edge-commands-worker")) {
      REDIS_EDGES.forEach((edgeId) => {
        window.setTimeout(() => light(edgeId), COMMAND_EDGES.length * STAGGER_MILLISECONDS);
      });
    }
  }

  /// Marks the telemetry lines that are carrying something.
  ///
  /// Driven by readings rather than by events, so it is a state that is turned
  /// on and left on while the rate is above zero - not a flash that decays. A
  /// line that stops crawling means collection stopped, which is a thing an
  /// operator needs to see without reading a number.
  function showAbsorbing(gauges) {
    if (!motionAllowed) return;

    for (const { edge, reading } of ABSORBING) {
      const line = byId(edge);
      const value = gauges.find((gauge) => gauge.id === reading);
      if (!line || !value) continue;

      // The em dash is the panel's "no reading" mark. Unknown is not zero, and
      // must not be drawn as a confident "nothing is flowing".
      const flowing = value.value !== "—" && Number.parseFloat(value.value) > 0;
      line.classList.toggle("absorbing", flowing);
    }
  }

  // ===========================================================================
  // What everything on the drawing is
  //
  // Written for somebody who has never seen this system, and who may never have
  // seen a message broker at all. Each entry answers three questions in order:
  // what kind of thing is this, what does it do, and what is it doing *here* -
  // the last being the part nobody can guess. Redis is not a cache in this
  // system; it is what stops a message delivered twice from being acted on
  // twice, and no amount of reading the Redis documentation would reveal that.
  //
  // This lives in the script rather than in `data-` attributes on the drawing
  // because it is several paragraphs. In the markup it would bury the diagram;
  // here it is one table that reads like a document and reviews like one.
  // ===========================================================================

  const SOURCE = "https://github.com/StewartScottRogers/PrototypeRustMonoMicroservice/tree/master";

  const WHAT_IS = {
    clients: {
      kind: "Not part of the system",
      title: "Clients",
      note: "Whatever is calling the platform from outside — a curl command you type, the DevDemo.cmd script, or the traffic generator in the left-hand rail of the console. It is drawn so the diagram starts where a request starts, rather than in the middle.",
      links: [{ label: "DevDemo.cmd — the narrated demonstration", href: SOURCE + "/DevDemo.cmd" }],
    },
    gateway: {
      kind: "A microservice in this repository",
      title: "Gateway service",
      note: "The front door. Every request from outside arrives here first. It does two different jobs on purpose, so you can compare them: POST /relay calls the echo service and waits for the answer, which is the simple way; POST /order writes the order and a \"please publish this\" row into PostgreSQL in a single transaction, then answers immediately without waiting for any of the work to be done. The second is the whole point of the platform — the caller is not kept waiting for something that has not happened yet.",
      links: [
        { label: "Source — Microservices/gateway-service", href: SOURCE + "/Microservices/gateway-service" },
        { label: "The transactional outbox pattern", href: "https://microservices.io/patterns/data/transactional-outbox.html" },
      ],
    },
    postgres: {
      kind: "A database, and a third-party product",
      title: "PostgreSQL",
      note: "A relational database — the ordinary kind, where data lives in tables and a transaction either happens completely or not at all. Here it holds three things: the orders themselves, the outbox table of messages waiting to be published, and the audit records written at the far end of the chain. That the order and its outbox row are written in one transaction is what makes losing a message impossible: either both are stored or neither is.",
      links: [{ label: "PostgreSQL documentation", href: "https://www.postgresql.org/docs/current/" }],
    },
    relay: {
      kind: "A microservice in this repository",
      title: "Outbox relay",
      note: "Reads committed rows out of the outbox table and publishes them to the message bus, then marks them done. It exists as its own process rather than as part of the gateway for one reason: publishing and answering requests are different workloads, and this way you can run more of one without running more of the other. It is also why a message cannot be lost in a crash — the row is already safely in the database before anybody tries to publish it.",
      links: [
        { label: "Source — Microservices/outbox-relay", href: SOURCE + "/Microservices/outbox-relay" },
        { label: "The polling publisher pattern", href: "https://microservices.io/patterns/data/polling-publisher.html" },
      ],
    },
    echo: {
      kind: "A microservice in this repository",
      title: "Echo service",
      note: "The simplest possible service: it receives a message and sends it straight back. It is here as the contrast to everything else on this drawing — one call, one answer, the caller waits. Copy this crate when you want to start a new simple service; it is the smallest thing that still passes the whole build, test and container pipeline.",
      links: [{ label: "Source — Microservices/echo-service", href: SOURCE + "/Microservices/echo-service" }],
    },
    tag: {
      kind: "Notation, not a thing",
      title: "Continuation tag",
      note: "A drawing convention, borrowed from wiring diagrams. The line leaving band one and the line entering band two are the same line — it is broken and labelled A at both ends so the picture can be read in bands instead of as one long horizontal run. Nothing is installed or running here.",
      links: [],
    },
    nats: {
      kind: "A message broker, and a third-party product",
      title: "NATS with JetStream",
      note: "The post office in the middle of the system. Services do not call each other here; they hand a message to the broker and move on. JetStream is the part of NATS that stores those messages durably, so one can be delivered to a service that was not running when it was sent, and retried if handling it fails. Three streams live in it, drawn on this band.",
      links: [
        { label: "What JetStream is", href: "https://docs.nats.io/nats-concepts/jetstream" },
        { label: "The messaging-and-eventing skill in this repository", href: SOURCE + "/.claude/skills/messaging-and-eventing/SKILL.md" },
      ],
    },
    commands: {
      kind: "A stream inside the broker",
      title: "Command stream",
      note: "A durable, named log of instructions — \"process this order\" — each meant for exactly one service to carry out. Both worker replicas subscribe under the same durable consumer name, and that shared name is what makes the broker hand each command to only one of them. Add a third worker and the same commands are simply spread across three. This is the difference between messaging and eventing: a command is work to be done once.",
      links: [
        { label: "How JetStream consumers work", href: "https://docs.nats.io/nats-concepts/jetstream/consumers" },
        { label: "The competing consumers pattern", href: "https://learn.microsoft.com/azure/architecture/patterns/competing-consumers" },
      ],
    },
    worker: {
      kind: "A microservice in this repository, running two copies",
      title: "Worker",
      note: "Does the actual work of an order after the caller has already been answered. It takes one command from the stream, checks Redis to make sure it has not already handled that exact message, does the work, and publishes an event saying what happened. Two copies run at once and share the load. If it fails, the broker gives the message back and it is tried again — three times, after which the message is parked on the dead-letter stream rather than retried forever.",
      links: [
        { label: "Source — Microservices/worker-service", href: SOURCE + "/Microservices/worker-service" },
        { label: "The idempotent consumer pattern", href: "https://microservices.io/patterns/communication-style/idempotent-consumer.html" },
      ],
    },
    events: {
      kind: "A stream inside the broker",
      title: "Event stream",
      note: "A durable log of statements of fact — \"this order was processed\" — addressed to nobody in particular. Every subscriber holds its own name and therefore receives its own copy, which is the opposite of the command stream next door. The notifier and the audit service both read every event, neither knows the other exists, and a third could be added tomorrow without changing the worker at all. This is eventing: something happened, and whoever cares may react.",
      links: [
        { label: "How JetStream consumers work", href: "https://docs.nats.io/nats-concepts/jetstream/consumers" },
        { label: "The messaging-and-eventing skill in this repository", href: SOURCE + "/.claude/skills/messaging-and-eventing/SKILL.md" },
      ],
    },
    notifier: {
      kind: "A microservice in this repository",
      title: "Notifier",
      note: "One of two independent reactions to the same event. It stands in for whatever would tell a customer their order is progressing — an email, a push notification, a text message. It reads from its own subscription, so it sees every event rather than a share of them, and it can be stopped and restarted without the audit service noticing.",
      links: [{ label: "Source — Microservices/notifier-service", href: SOURCE + "/Microservices/notifier-service" }],
    },
    audit: {
      kind: "A microservice in this repository",
      title: "Audit",
      note: "The second, entirely separate reaction to the same event. It writes a permanent record back into PostgreSQL — what happened, and when. Watch the two lines from the event stream light up together rather than one after the other: that simultaneity is the thing this platform exists to show. One event, two copies, two services that know nothing about each other.",
      links: [{ label: "Source — Microservices/audit-service", href: SOURCE + "/Microservices/audit-service" }],
    },
    redis: {
      kind: "A key-value store, and a third-party product",
      title: "Redis",
      note: "An in-memory store of keys and values, most often used as a cache. It is not a cache here. A message broker that promises to deliver a message at least once will sometimes deliver it twice, and processing the same order twice would be wrong. Before doing any work the worker claims the message's identifier in Redis; if the claim fails, that message has already been handled and this copy is dropped. That is all it is doing on this drawing.",
      links: [
        { label: "Redis documentation", href: "https://redis.io/docs/latest/" },
        { label: "The idempotent consumer pattern", href: "https://microservices.io/patterns/communication-style/idempotent-consumer.html" },
      ],
    },
    deadletter: {
      kind: "A stream inside the broker",
      title: "Dead-letter stream",
      note: "Where a message goes when it has failed three times. Retrying forever would turn one broken message into an endless loop that buries everything behind it, so it is set aside here instead and the queue moves on. Nothing clears these on their own — that is deliberate, because a parked message is a question somebody needs to answer. DevReplay.cmd puts them back on the queue when the underlying problem is fixed; run it with --dry-run first to see what would be replayed.",
      links: [
        { label: "DevReplay.cmd, and the tool behind it", href: SOURCE + "/Microservices/dlq-replay" },
        { label: "The dead letter queue pattern", href: "https://docs.nats.io/nats-concepts/jetstream/consumers" },
      ],
    },
    prometheus: {
      kind: "A metrics database, and a third-party product",
      title: "Prometheus",
      note: "Collects numbers. Every service publishes counters and timings at a /metrics address, and Prometheus reads all of them every two seconds and keeps the history. Every rate and percentile shown as a badge on this drawing came from a query against it. It answers questions about quantity over time — how many, how fast, how long — and nothing about any individual request.",
      links: [
        { label: "Open Prometheus on this machine", href: "http://localhost:9090" },
        { label: "What Prometheus is", href: "https://prometheus.io/docs/introduction/overview/" },
      ],
    },
    grafana: {
      kind: "A dashboard tool, and a third-party product",
      title: "Grafana",
      note: "Draws graphs of the numbers Prometheus is holding. Prometheus stores and answers queries; Grafana is what turns those answers into dashboards you can watch over time. It is where you go to ask what the system was doing an hour ago, which this panel deliberately cannot tell you — this panel only shows now. The dashboards live in version control in this repository, not inside Grafana, so a change to a graph is reviewable like any other change.",
      links: [
        { label: "Open Grafana on this machine", href: "http://localhost:3000" },
        { label: "What Grafana is", href: "https://grafana.com/docs/grafana/latest/introduction/" },
      ],
    },
    jaeger: {
      kind: "A tracing tool, and a third-party product",
      title: "Jaeger",
      note: "Follows one single request all the way through the system and shows you where its time went. Where Prometheus answers \"how many\" and Grafana answers \"what did that look like over the last hour\", Jaeger answers \"what happened to this one\" — every service it touched, in order, with a bar for each step. It works across the broker as well as across calls, so a single order can be followed from the gateway through the worker and into the audit service.",
      links: [
        { label: "Open Jaeger on this machine", href: "http://localhost:16686" },
        { label: "What tracing is", href: "https://opentelemetry.io/docs/concepts/observability-primer/#distributed-traces" },
      ],
    },
  };

  // ---------------------------------------------------------------------------
  // The hover panel
  //
  // One component, two jobs. On a reading badge it names the number, its unit
  // and what it counts. On a box it says what the thing is and where to read
  // more. Both open when the pointer is *paused* rather than the instant it
  // crosses one, so moving across the drawing does not leave panels flashing.
  //
  // The panel on a box carries links, so unlike an ordinary tooltip it has to
  // survive the pointer leaving the box: the pointer needs somewhere to travel
  // on its way in. Hence the closing grace period below, cancelled when the
  // pointer arrives in the panel itself.
  // ---------------------------------------------------------------------------

  // Long enough that crossing a badge is not "pausing" on it, short enough that
  // deliberately stopping does not feel broken.
  const HOVER_PAUSE_MILLISECONDS = 320;
  // How long the panel survives after the pointer leaves, so it can be entered.
  const CLOSE_GRACE_MILLISECONDS = 280;

  let openTarget = null;   // the .rd or .nd the panel is describing
  let hoverTimer = null;
  let closeTimer = null;

  function fillTip(target) {
    const isReading = target.classList.contains("rd");
    const entry = isReading ? null : WHAT_IS[target.dataset.what];
    const figure = byId("tip-figure");
    const links = byId("tip-links");

    byId("tip-kind").textContent = isReading ? "Reading" : (entry ? entry.kind : "");
    byId("tip-title").textContent = isReading ? target.dataset.title : (entry ? entry.title : "");
    byId("tip-note").textContent = isReading ? target.dataset.note : (entry ? entry.note : "");

    // The live figure belongs only to a reading. A box has a lamp and a detail
    // line of its own on the drawing, and repeating them here would be noise.
    figure.hidden = !isReading;
    if (isReading) {
      const value = target.querySelector(".rd-val");
      byId("tip-value").textContent = value ? value.textContent : "—";
      byId("tip-value").style.color = value ? value.getAttribute("fill") : "";
      byId("tip-unit").textContent = target.dataset.unit;
    }

    links.textContent = "";
    for (const link of (entry && entry.links) || []) {
      const anchor = document.createElement("a");
      anchor.textContent = link.label;
      anchor.href = link.href;
      // A new tab, always. This panel is normally being read inside the
      // console's frame, and replacing it would strand the reader with no
      // way back to the drawing they were looking at.
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
      links.appendChild(anchor);
    }
    links.hidden = links.childElementCount === 0;
  }

  function showTip(target) {
    const tip = byId("tip");
    window.clearTimeout(closeTimer);
    openTarget = target;
    fillTip(target);
    tip.hidden = false;

    // Measured after unhiding, because a hidden element has no size. Both
    // rectangles are in viewport coordinates, so a horizontally scrolled
    // diagram needs no correction of its own.
    const frame = document.querySelector(".bezel").getBoundingClientRect();
    const anchor = target.getBoundingClientRect();

    let left = anchor.left - frame.left + anchor.width / 2 - tip.offsetWidth / 2;
    let top = anchor.top - frame.top - tip.offsetHeight - 10;

    // Not enough room above: drop it below rather than off the top.
    if (top < 4) top = anchor.bottom - frame.top + 10;
    left = Math.max(4, Math.min(left, frame.width - tip.offsetWidth - 4));

    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }

  function hideTip() {
    window.clearTimeout(hoverTimer);
    window.clearTimeout(closeTimer);
    openTarget = null;
    byId("tip").hidden = true;
  }

  function scheduleClose() {
    window.clearTimeout(closeTimer);
    closeTimer = window.setTimeout(hideTip, CLOSE_GRACE_MILLISECONDS);
  }

  for (const target of document.querySelectorAll(".rd, .nd")) {
    const entry = WHAT_IS[target.dataset.what];
    // Named from the same source the panel uses, so the two cannot drift. A
    // badge otherwise reads as four characters with no context, and a box as
    // whatever its label happens to say.
    target.setAttribute("aria-label", target.classList.contains("rd")
      ? target.dataset.title + ", " + target.dataset.unit
      : (entry ? entry.title + ". " + entry.kind + "." : ""));

    target.addEventListener("mouseenter", () => {
      window.clearTimeout(hoverTimer);
      window.clearTimeout(closeTimer);
      hoverTimer = window.setTimeout(() => showTip(target), HOVER_PAUSE_MILLISECONDS);
    });
    target.addEventListener("mouseleave", () => {
      window.clearTimeout(hoverTimer);
      scheduleClose();
    });
    // No pause on the keyboard path: arriving by Tab is already deliberate.
    target.addEventListener("focus", () => showTip(target));
    target.addEventListener("blur", scheduleClose);

    // Enter or Space follows the first link. Tab cannot reach into the panel -
    // it is not next in the document - so without this a keyboard reader could
    // see that there is somewhere to go and have no way to get there.
    target.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const first = entry && entry.links && entry.links[0];
      if (!first) return;
      event.preventDefault();
      window.open(first.href, "_blank", "noopener,noreferrer");
    });
  }

  // The pointer arriving in the panel cancels its closing; leaving restarts it.
  // This is the whole reason the panel is not `pointer-events:none`.
  byId("tip").addEventListener("mouseenter", () => window.clearTimeout(closeTimer));
  byId("tip").addEventListener("mouseleave", scheduleClose);

  // Escape closes it, which is the one thing a keyboard user cannot otherwise
  // do without moving focus off the thing they are reading about.
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") hideTip();
  });

  // ---------------------------------------------------------------------------
  // The three indicators
  // ---------------------------------------------------------------------------

  function showConnection(label, stale) {
    const connection = byId("connection");
    // Rewriting the markup restarts the heartbeat animation, which keeps it in
    // step with the messages rather than free-running.
    connection.innerHTML = '<span id="beat">&#9679;</span> ' + label;
    connection.className = stale ? "stale" : "";
  }

  function showAges(tick) {
    const lamps = byId("age-lamps");
    if (tick.prometheus_age_milliseconds < LAMPS_FRESH_MILLISECONDS) {
      lamps.textContent = "live";
      lamps.style.color = "";
    } else {
      lamps.textContent = Math.round(tick.prometheus_age_milliseconds / 1000) + " seconds ago";
      lamps.style.color = COLOURS.degraded;
    }

    const flow = byId("age-flow");
    flow.textContent = tick.live_ok ? "live" : "not connected";
    flow.style.color = tick.live_ok ? "" : COLOURS.degraded;
    // The time since the last message belongs here rather than in the headline.
    // On a genuinely idle system that number is large and perfectly healthy, and
    // putting it on the strip would train people to ignore an amber panel.
    flow.title = tick.last_message_age_milliseconds === null
      ? "no message seen since this panel started"
      : "last message " + Math.round(tick.last_message_age_milliseconds / 1000) + " seconds ago";
  }

  // ---------------------------------------------------------------------------
  // The feed
  // ---------------------------------------------------------------------------

  function handle(message) {
    // A restarted server means the numbering starts again and this browser's
    // held value means nothing. Same recovery either way; only one deserves a
    // log line.
    if (epoch !== null && message.epoch !== epoch && message.epoch !== "00000000-0000-0000-0000-000000000000") {
      console.info("[mimic] the service restarted; resynchronising");
      lastSeq = -1;
    }
    if (message.epoch !== "00000000-0000-0000-0000-000000000000") epoch = message.epoch;

    // A frame sent on connect or after a lag carries sequence 0 deliberately:
    // it is a fresh whole picture and always applies.
    if (message.seq !== 0 && message.seq <= lastSeq) return;
    if (message.seq !== 0) lastSeq = message.seq;

    if (message.type === "frame") {
      paint(message.state);
    } else if (message.type === "pulse") {
      paintGauges(message.gauges);
      animate(message.edges);
    } else if (message.type === "tick") {
      showAges(message);
      showConnection("LIVE", false);
    }
  }

  // A socket that half-opens produces silence, not an error - no event fires at
  // all. The socket's own error handling therefore cannot be the only guard.
  // Never blank the panel: an empty screen is indistinguishable from a healthy
  // system with nothing happening.
  // Silence is the failure mode a socket cannot report: a half-open connection
  // fires no event at all. The watchdog both says so and *acts* - relabelling
  // alone would leave the panel permanently frozen with an honest label, which
  // is only half a fix.
  function armWatchdog() {
    window.clearTimeout(watchdog);
    watchdog = window.setTimeout(() => {
      goStale();
      // Tear the silent socket down so onclose runs the normal reconnect.
      // Never blank the picture: the last good one stays on screen.
      if (socket) socket.close();
    }, WATCHDOG_MILLISECONDS);
  }

  // When the feed stops, every claim it was carrying stops being true. Leaving
  // the ages reading "live" from the last tick received would keep asserting
  // freshness that nothing is refreshing.
  function goStale() {
    showConnection("NO FEED", true);
    for (const id of ["age-lamps", "age-flow"]) {
      const element = byId(id);
      element.textContent = "unknown";
      element.style.color = COLOURS.degraded;
    }
  }

  function connect() {
    if (sampling) return;
    // Without this guard, a wake-from-sleep can run connect() while a socket is
    // still open, orphaning one whose handlers keep firing into the same page.
    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;

    const scheme = location.protocol === "https:" ? "wss://" : "ws://";
    const opening = new WebSocket(scheme + location.host + "/api/live");
    socket = opening;

    opening.onopen = () => {
      // Reset here rather than on the first message: the socket opened, so
      // whatever failed before is not structural.
      failedOpens = 0;
      backoff = 500;
      showConnection("LIVE", false);
      armWatchdog();
    };

    opening.onmessage = (event) => {
      armWatchdog();
      try {
        handle(JSON.parse(event.data));
      } catch (error) {
        console.warn("[mimic] could not read a message", error);
      }
    };

    opening.onclose = () => {
      // A stale handler from an orphaned socket must not drive reconnection.
      if (socket !== opening) return;

      goStale();

      // Only an open that never succeeded counts towards giving up. A socket
      // that opened and later closed is an ordinary restart, and counting
      // those would downgrade the panel to sampling forever after three
      // service restarts - which it would then never recover from.
      if (opening.readyState === WebSocket.CLOSED && !opening.hadOpened) {
        failedOpens += 1;
      }

      // Three failures to *open* suggests something structural - a proxy
      // stripping the upgrade header, most often - so fall back to asking.
      if (failedOpens >= 3) {
        startSampling();
        return;
      }

      // Jitter, so twenty tabs waking from a suspended machine do not all
      // reconnect in the same instant.
      const jittered = backoff * (0.8 + Math.random() * 0.4);
      window.setTimeout(connect, jittered);
      backoff = Math.min(backoff * 2, 10000);
    };

    opening.addEventListener("open", () => { opening.hadOpened = true; });
    opening.onerror = () => opening.close();
  }

  // The reason /api/state is kept rather than deprecated.
  //
  // Sampling is a fallback, not a destination: every thirty seconds it tries
  // the socket again. A proxy is reconfigured, a service is restarted, a
  // network changes - and a panel that had quietly settled into one-second
  // polling with no animation would never notice it could do better.
  function startSampling() {
    if (sampling) return;
    console.info("[mimic] falling back to sampling; the socket would not open");
    showConnection("SAMPLED", true);

    sampling = window.setInterval(async () => {
      try {
        const response = await fetch("/api/state", { cache: "no-store" });
        if (!response.ok) throw new Error(response.status);
        paint(await response.json());
        showConnection("SAMPLED", true);
      } catch {
        showConnection("NO FEED", true);
      }
    }, 1000);

    window.setTimeout(stopSampling, 30000);
  }

  function stopSampling() {
    if (!sampling) return;
    window.clearInterval(sampling);
    sampling = null;
    failedOpens = 0;
    backoff = 500;
    connect();
  }

  // A sleeping laptop is the case where the socket is dead and nothing said so.
  // A suspended machine's socket often reads as OPEN while being long dead, so
  // re-arming the watchdog is what actually recovers it: three seconds of
  // silence then tears it down and reconnects. Calling connect() alone would
  // return immediately against that apparently-open socket.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (sampling) return;

    backoff = 500;
    failedOpens = 0;

    if (!socket || socket.readyState === WebSocket.CLOSED) {
      connect();
    } else {
      armWatchdog();
    }
  });

  connect();
  armWatchdog();
</script>
</body>
</html>
