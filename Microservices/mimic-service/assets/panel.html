<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Mimic — Order Platform</title>
<style>
  /* A control room commits to one visual world, so every colour is painted
     explicitly rather than inherited from whatever is framing the page. */
  :root {
    --void:#05080b; --ground:#080d12; --panel:#0d151c; --panel-2:#101a22;
    --edge:#22333e; --edge-hi:#334c5c;
    --ink:#c7d8e4; --dim:#6d8496; --far:#42555f;
    --ok:#2fd98a; --warn:#ffb020; --fail:#ff4a4a; --unknown:#5a6b78;
    --sync:#34c3e0; --async:#b07cff;
    --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}
  body{background:var(--void);color:var(--ink);font-family:var(--mono);margin:0;
       padding:1.25rem 1rem 2.5rem;-webkit-font-smoothing:antialiased}
  .shell{max-width:96rem;margin:0 auto}
  .strip{display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;justify-content:space-between;align-items:baseline;
         padding:.3rem .4rem .7rem;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--far)}
  .strip b{color:var(--dim);font-weight:500}
  #connection{color:var(--ok)}
  #connection.stale{color:var(--warn)}
  /* Positioned, because the hover panel below is placed against it. */
  .bezel{position:relative;background:var(--ground);border:1px solid var(--edge);
         box-shadow:0 0 0 1px #000 inset,0 24px 60px -30px #000;padding:.5rem}

  /* The hover panel.
     A badge on the drawing has room for four characters, so everything the old
     instrument tile said in full - the name, the unit, and what the number
     actually counts - is said here instead, on demand.
     Deliberately not the browser's own `title` tooltip: that takes about a
     second to appear, cannot be styled, and would arrive in the operating
     system's font in the middle of a control room. `pointer-events:none` keeps
     it from stealing the hover that summoned it. */
  .tip{position:absolute;z-index:5;pointer-events:none;max-width:22rem;
       background:var(--panel-2);border:1px solid var(--edge-hi);
       box-shadow:0 14px 34px -14px #000;padding:.5rem .65rem;
       font-size:.72rem;line-height:1.55}
  .tip[hidden]{display:none}
  .tip-t{color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-size:.6rem}
  .tip-v{font-size:1.05rem;margin:.2rem 0 .25rem;color:var(--ink)}
  .tip-v span{font-size:.68rem;color:var(--far);letter-spacing:.08em}
  .tip-n{color:var(--dim);text-wrap:pretty}
  .scroller{overflow-x:auto}
  svg{display:block;width:100%;min-width:72rem;height:auto}
  figure{margin:0}
  figcaption{margin:.9rem auto 0;max-width:60rem;font-size:.78rem;line-height:1.7;
             color:var(--dim);text-align:center;text-wrap:pretty}
  figcaption b{color:var(--ink);font-weight:500}
  /* A line that just carried a message. Brightening and thickening is
     length-independent, which matters because most connectors here are 32 to 52
     units long against a 1500-unit canvas - a travelling dot on those would be a
     twitch, not a journey. */
  .lit{stroke-width:2.8 !important;filter:brightness(1.9)}

  @media (prefers-reduced-motion:no-preference){
    /* A one-second heartbeat on the live indicator, so a frozen panel is
       obvious without reading a timestamp. */
    #beat{animation:beat 1s steps(1,end) infinite}
    @keyframes beat{50%{opacity:.2}}

    .lit{transition:stroke-width .12s ease-out,filter .12s ease-out}

    /* The asynchronous lines already carry a dash pattern, so flowing them
       costs no new elements at all - just an offset animation. */
    .flowing{animation:march .6s linear infinite}
    @keyframes march{to{stroke-dashoffset:-24}}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="strip">
    <span>Order Platform &middot; <b>Live Mimic</b></span>
    <!--
      Three separate claims, because they have three separate failure modes and
      collapsing any pair produces a panel that is confidently wrong about the
      half that still works:

        lamps      the sampled data is fresh        (from the server's own clock)
        flow       the message bus tap is connected (not: messages are arriving)
        connection this browser is being told       (from the watchdog below)

      A lit wire beside a grey lamp is correct behaviour, and a reader has to be
      able to see why rather than concluding the whole panel is broken.
    -->
    <span>Lamps <b id="age-lamps">&mdash;</b> &middot; Flow <b id="age-flow">&mdash;</b>
      &middot; <span id="connection"><span id="beat">&#9679;</span> LIVE</span></span>
  </div>

  <div class="bezel">
    <!-- Filled and placed from script; `aria-live` so a screen reader announces
         it when a keyboard user tabs onto a reading, which is the same moment a
         pointer user would see it appear. -->
    <div class="tip" id="tip" role="status" aria-live="polite" hidden>
      <div class="tip-t" id="tip-title"></div>
      <div class="tip-v"><b id="tip-value">&mdash;</b> <span id="tip-unit"></span></div>
      <div class="tip-n" id="tip-note"></div>
    </div>

    <div class="scroller">
      <figure>
        <svg viewBox="0 0 1224 800" role="img"
             aria-label="Live mimic of the order platform, read left to right and then top to bottom. Band one: clients post an order to the gateway service, which writes the order and an outbox row to PostgreSQL in one transaction, and the outbox relay polls that table. The gateway also calls the echo service synchronously as a simple example. Band two: the relay publishes to the command stream on the NATS JetStream broker, one worker replica takes each command, and the worker publishes to the event stream, which every subscriber reads a copy of, so both the notifier and the audit service react. Redis holds idempotency keys and repeatedly failing messages are parked on the dead-letter stream. Band three: Prometheus, Grafana and Jaeger receive telemetry from every service. Each live rate or depth is shown as a small figure attached to the thing it measures; pausing the pointer on one names it in full.">
          <defs>
            <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#34c3e0"/></marker>
            <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#b07cff"/></marker>
            <marker id="arrow-quiet" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#5c7382"/></marker>
          </defs>

          <style>
            .box      { fill:#0d151c; stroke:#334c5c; stroke-width:1.4; }
            .box-soft { fill:#0a1118; stroke:#22333e; stroke-width:1.2; }
            .box-tag  { fill:#0a1118; stroke:#334c5c; stroke-width:1.2; stroke-dasharray:3 3; }
            .name     { font-family:inherit; font-size:14px; fill:#c7d8e4; letter-spacing:.04em; }
            .sub      { font-family:inherit; font-size:10.5px; fill:#6d8496; }
            .detail   { font-family:inherit; font-size:10.5px; fill:#6d8496; }
            .band     { font-family:inherit; font-size:11px; fill:#6d8496; letter-spacing:.2em; }
            .band-n   { font-family:inherit; font-size:11px; fill:#34c3e0; letter-spacing:.2em; }
            .edge-lbl { font-family:inherit; font-size:10px; fill:#5c7382; letter-spacing:.02em; }
            .line-sync  { stroke:#34c3e0; stroke-width:1.6; fill:none; }
            .line-async { stroke:#b07cff; stroke-width:1.6; fill:none; stroke-dasharray:7 5; }
            .line-quiet { stroke:#5c7382; stroke-width:1.2; fill:none; stroke-dasharray:2 4; }
            .rule     { stroke:#1a2831; stroke-width:1; }
            .tag-txt  { font-family:inherit; font-size:12px; fill:#34c3e0; letter-spacing:.1em; }
            .read-unt { font-family:inherit; font-size:10px; fill:#42555f; }

            /* ---- the inline readings ----
               Each number sits on the lower edge of the thing it measures, so
               "5.07" is read as a property of the notifier rather than as the
               fifth row of a table that has to be matched back to a box.
               56 by 20 units holds "1714" or "5.07" and nothing else; the name,
               the unit and the sentence explaining it live in the hover panel,
               which is the trade that lets the badge be this small.

               It stands out by being brighter than its host, not larger: a fill
               a step above the node's own, and a border in the reading's colour
               - cyan for a synchronous count, violet for one carried by the
               message bus, matching the arrows.

               Neither `stroke` here nor `fill` on .rd-val, deliberately. Both
               are painted from script as readings arrive, and a class rule
               overrides a presentation attribute - which is exactly how the
               amber warning colour on the old instrument tiles was silently
               lost. */
            .rd       { cursor:help; }
            .rd-box   { fill:#16232e; stroke-width:1.1; }
            .rd-val   { font-family:inherit; font-size:13px; letter-spacing:.02em; }
            .rd:hover .rd-box, .rd:focus .rd-box { fill:#1e3241; stroke-width:1.8; }
            .rd:focus { outline:none; }
          </style>

          <!-- ============ ALARM BANNER ============ -->
          <rect id="alarm-box" x="40" y="20" width="1136" height="52" rx="2"
                fill="#0f1a14" stroke="#2fd98a" stroke-width="1.4"/>
          <circle id="alarm-led" cx="70" cy="46" r="7" fill="#2fd98a"/>
          <text id="alarm-title" x="96" y="51" font-size="12" fill="#2fd98a" letter-spacing="2.4">ALL CLEAR</text>
          <line x1="212" y1="30" x2="212" y2="62" class="rule"/>
          <text id="alarm-text" x="234" y="51" font-size="13" fill="#c7d8e4">no active alarms</text>
          <text id="alarm-count" x="1152" y="51" font-size="11" fill="#6d8496" text-anchor="end">0 ACTIVE</text>

          <!-- ================================================================
               BAND 1 — accept and store. Reads left to right.
               ================================================================ -->
          <text class="band-n" x="48" y="106">1</text>
          <text class="band" x="70" y="106">ACCEPT AND STORE &#183; SYNCHRONOUS</text>
          <line x1="392" y1="102" x2="1060" y2="102" class="rule"/>

          <!-- clients -->
          <rect class="box-soft" x="48" y="136" width="150" height="66" rx="2"/>
          <text class="name" x="123" y="167" text-anchor="middle">Clients</text>
          <text class="sub"  x="123" y="185" text-anchor="middle">curl or DevDemo.cmd</text>

          <path id="edge-clients-gateway" class="line-sync" d="M198 169 H244" marker-end="url(#arrow-sync)"/>
          <text class="edge-lbl" x="221" y="128" text-anchor="middle">place an order</text>

          <!-- gateway -->
          <rect class="box" x="248" y="136" width="196" height="66" rx="2"/>
          <circle id="led-gateway" cx="428" cy="150" r="6" fill="#5a6b78"/>
          <text class="name" x="336" y="167" text-anchor="middle">Gateway service</text>
          <text id="txt-gateway" class="detail" x="336" y="185" text-anchor="middle">&mdash;</text>

          <g class="rd" tabindex="0" role="img"
             data-title="Orders accepted" data-unit="per second"
             data-note="Orders the gateway service took in and committed, averaged over the last fifteen seconds.">
            <rect class="rd-box" id="box-g-accepted" data-hue="#34c3e0" stroke="#34c3e0"
                  x="260" y="192" width="56" height="20" rx="2"/>
            <text class="rd-val" id="g-accepted" data-hue="#34c3e0" fill="#34c3e0"
                  x="288" y="206" text-anchor="middle">&mdash;</text>
          </g>

          <path id="edge-gateway-postgres" class="line-sync" d="M444 169 H489" marker-end="url(#arrow-sync)"/>
          <text class="edge-lbl" x="466" y="128" text-anchor="middle">one transaction</text>

          <!-- postgresql -->
          <rect class="box" x="493" y="136" width="196" height="66" rx="2"/>
          <circle id="led-postgres" cx="673" cy="150" r="6" fill="#5a6b78"/>
          <text class="name" x="581" y="167" text-anchor="middle">PostgreSQL</text>
          <text id="txt-postgres" class="detail" x="581" y="185" text-anchor="middle">&mdash;</text>

          <path id="edge-postgres-relay" class="line-sync" d="M689 169 H734" marker-end="url(#arrow-sync)"/>
          <text class="edge-lbl" x="711" y="128" text-anchor="middle">poll</text>

          <!-- outbox relay -->
          <rect class="box" x="738" y="136" width="196" height="66" rx="2"/>
          <circle id="led-relay" cx="918" cy="150" r="6" fill="#5a6b78"/>
          <text class="name" x="826" y="167" text-anchor="middle">Outbox relay</text>
          <text id="txt-relay" class="detail" x="826" y="185" text-anchor="middle">&mdash;</text>

          <g class="rd" tabindex="0" role="img"
             data-title="Outbox rows published" data-unit="per second"
             data-note="Committed outbox rows the relay has put on the message bus, averaged over the last fifteen seconds. It should track the accepted rate; a lasting gap means the relay is behind.">
            <rect class="rd-box" id="box-g-relayed" data-hue="#b07cff" stroke="#b07cff"
                  x="750" y="192" width="56" height="20" rx="2"/>
            <text class="rd-val" id="g-relayed" data-hue="#b07cff" fill="#b07cff"
                  x="778" y="206" text-anchor="middle">&mdash;</text>
          </g>

          <path id="edge-relay-tag" class="line-async" d="M934 169 H986" marker-end="url(#arrow-async)"/>

          <!-- continuation tag: leaves band 1 -->
          <rect class="box-tag" x="990" y="146" width="70" height="46" rx="2"/>
          <text class="tag-txt" x="1025" y="175" text-anchor="middle">&#9660; A</text>

          <!-- the synchronous side example, hanging below the gateway -->
          <path id="edge-gateway-echo" class="line-sync" d="M336 202 V244" marker-end="url(#arrow-sync)"/>
          <text class="edge-lbl" x="348" y="226">a simpler example</text>

          <rect class="box-soft" x="248" y="248" width="196" height="56" rx="2"/>
          <circle id="led-echo" cx="428" cy="262" r="6" fill="#5a6b78"/>
          <text class="name" x="336" y="274" text-anchor="middle">Echo service</text>
          <text id="txt-echo" class="detail" x="336" y="292" text-anchor="middle">&mdash;</text>

          <!-- ================================================================
               BAND 2 — the broker. Reads left to right, fans out downward.
               ================================================================ -->
          <text class="band-n" x="48" y="352">2</text>
          <text class="band" x="70" y="352">HAND OFF THROUGH THE BROKER &#183; NATS JETSTREAM</text>
          <circle id="led-nats" cx="500" cy="348" r="6" fill="#5a6b78"/>
          <text id="txt-nats" class="detail" x="516" y="352">&mdash;</text>
          <line x1="620" y1="348" x2="1060" y2="348" class="rule"/>

          <!-- continuation tag: enters band 2 -->
          <rect class="box-tag" x="48" y="378" width="70" height="46" rx="2"/>
          <text class="tag-txt" x="83" y="407" text-anchor="middle">A &#9654;</text>

          <path id="edge-tag-commands" class="line-async" d="M118 401 H150" marker-end="url(#arrow-async)"/>

          <!-- command stream -->
          <rect class="box" x="154" y="372" width="218" height="66" rx="2"/>
          <text class="name" x="263" y="399" text-anchor="middle">Command stream</text>
          <text class="sub"  x="263" y="417" text-anchor="middle">one shared consumer</text>

          <g class="rd" tabindex="0" role="img"
             data-title="Waiting for the worker" data-unit="messages"
             data-note="Commands sitting on the stream that no worker has claimed yet. Past 100 the worker is drawn as backed up rather than healthy.">
            <rect class="rd-box" id="box-g-queue" data-hue="#34c3e0" stroke="#34c3e0"
                  x="166" y="428" width="56" height="20" rx="2"/>
            <text class="rd-val" id="g-queue" data-hue="#34c3e0" fill="#34c3e0"
                  x="194" y="442" text-anchor="middle">&mdash;</text>
          </g>

          <path id="edge-commands-worker" class="line-async" d="M372 405 H422" marker-end="url(#arrow-async)"/>
          <text class="edge-lbl" x="397" y="364" text-anchor="middle">one takes it</text>

          <!-- worker
               Its two readings sit on the *top* edge, alone among the badges on
               this drawing. Everything else wears its reading on the lower edge,
               but the worker is the one node with lines leaving underneath it -
               to Redis and to the dead-letter stream - and a badge there would
               sit on top of them. -->
          <rect id="node-worker" class="box" x="426" y="372" width="196" height="66" rx="2"/>

          <g class="rd" tabindex="0" role="img"
             data-title="Orders processed" data-unit="per second"
             data-note="Commands the worker replicas finished, averaged over the last fifteen seconds. Both replicas share one durable consumer name, so this is the two of them combined rather than each.">
            <rect class="rd-box" id="box-g-processed" data-hue="#b07cff" stroke="#b07cff"
                  x="438" y="362" width="56" height="20" rx="2"/>
            <text class="rd-val" id="g-processed" data-hue="#b07cff" fill="#b07cff"
                  x="466" y="376" text-anchor="middle">&mdash;</text>
          </g>

          <g class="rd" tabindex="0" role="img"
             data-title="Slowest one in a hundred" data-unit="milliseconds"
             data-note="The ninety-ninth percentile of worker processing time over five minutes: ninety-nine orders in a hundred finish faster than this. Past 400 milliseconds the worker is drawn as degraded.">
            <rect class="rd-box" id="box-g-p99" data-hue="#34c3e0" stroke="#34c3e0"
                  x="540" y="362" width="56" height="20" rx="2"/>
            <text class="rd-val" id="g-p99" data-hue="#34c3e0" fill="#34c3e0"
                  x="568" y="376" text-anchor="middle">&mdash;</text>
          </g>
          <circle id="led-worker" cx="606" cy="386" r="6" fill="#5a6b78"/>
          <text class="name" x="514" y="399" text-anchor="middle">Worker</text>
          <text id="txt-worker" class="detail" x="514" y="417" text-anchor="middle">&mdash;</text>

          <path id="edge-worker-events" class="line-async" d="M622 405 H672" marker-end="url(#arrow-async)"/>
          <text class="edge-lbl" x="647" y="364" text-anchor="middle">publishes</text>

          <!-- event stream -->
          <rect class="box" x="676" y="372" width="218" height="66" rx="2"/>
          <text class="name" x="785" y="399" text-anchor="middle">Event stream</text>
          <text class="sub"  x="785" y="417" text-anchor="middle">every subscriber gets a copy</text>

          <!-- fan-out: two consumers, stacked so the copy is visible -->
          <path id="edge-events-notifier" class="line-async" d="M894 391 H932 V366 H976" marker-end="url(#arrow-async)"/>
          <path id="edge-events-audit" class="line-async" d="M894 419 H932 V452 H976" marker-end="url(#arrow-async)"/>

          <rect class="box" x="980" y="336" width="196" height="60" rx="2"/>
          <circle id="led-notifier" cx="1160" cy="350" r="6" fill="#5a6b78"/>
          <text class="name" x="1068" y="363" text-anchor="middle">Notifier</text>
          <text id="txt-notifier" class="detail" x="1068" y="381" text-anchor="middle">&mdash;</text>

          <g class="rd" tabindex="0" role="img"
             data-title="Notifications handled" data-unit="per second"
             data-note="Events the notifier took from its own durable subscription. It receives every event rather than a share of them, so this follows the worker's publish rate.">
            <rect class="rd-box" id="box-g-notified" data-hue="#b07cff" stroke="#b07cff"
                  x="992" y="386" width="56" height="20" rx="2"/>
            <text class="rd-val" id="g-notified" data-hue="#b07cff" fill="#b07cff"
                  x="1020" y="400" text-anchor="middle">&mdash;</text>
          </g>

          <rect class="box" x="980" y="422" width="196" height="60" rx="2"/>
          <circle id="led-audit" cx="1160" cy="436" r="6" fill="#5a6b78"/>
          <text class="name" x="1068" y="449" text-anchor="middle">Audit</text>
          <text id="txt-audit" class="detail" x="1068" y="467" text-anchor="middle">&mdash;</text>

          <g class="rd" tabindex="0" role="img"
             data-title="Audit events handled" data-unit="per second"
             data-note="Events the audit service took from its own separate subscription. It holds a different name from the notifier, so it gets its own copy of every event rather than competing for them.">
            <rect class="rd-box" id="box-g-audited" data-hue="#b07cff" stroke="#b07cff"
                  x="992" y="472" width="56" height="20" rx="2"/>
            <text class="rd-val" id="g-audited" data-hue="#b07cff" fill="#b07cff"
                  x="1020" y="486" text-anchor="middle">&mdash;</text>
          </g>

          <text class="edge-lbl" x="1176" y="510" text-anchor="end">writes an audit record back to PostgreSQL</text>

          <!-- what hangs below the worker: the store it dedupes with, and the
               place a message goes when it cannot succeed -->
          <path id="edge-worker-redis" class="line-async" d="M480 438 V486" marker-end="url(#arrow-async)"/>
          <text class="edge-lbl" x="300" y="470">claims each order once</text>

          <path id="edge-worker-deadletter" class="line-async" d="M568 438 V486" marker-end="url(#arrow-async)"/>
          <text class="edge-lbl" x="700" y="470">after three failed attempts</text>

          <rect class="box-soft" x="330" y="490" width="180" height="54" rx="2"/>
          <circle id="led-redis" cx="494" cy="503" r="5" fill="#5a6b78"/>
          <text class="name" x="420" y="515" text-anchor="middle">Redis</text>
          <text id="txt-redis" class="detail" x="420" y="532" text-anchor="middle">&mdash;</text>

          <rect class="box-soft" x="540" y="490" width="212" height="54" rx="2"/>
          <text class="name" x="646" y="515" text-anchor="middle">Dead-letter stream</text>
          <text class="sub"  x="646" y="532" text-anchor="middle">DevReplay.cmd returns them</text>

          <!-- On the right edge rather than the lower one, and centred rather
               than inset. This box is two lines of text in 54 units of height,
               so a badge on the bottom edge lands on top of "DevReplay.cmd
               returns them" - which is the sentence telling a reader what to do
               about the number. -->
          <g class="rd" tabindex="0" role="img"
             data-title="Parked as dead letters" data-unit="messages"
             data-note="Messages that failed three times and were set aside rather than retried forever. Any number above zero turns amber: nothing clears them on its own, and DevReplay.cmd is what puts them back on the queue.">
            <rect class="rd-box" id="box-g-dlq" data-hue="#34c3e0" stroke="#34c3e0"
                  x="740" y="507" width="56" height="20" rx="2"/>
            <text class="rd-val" id="g-dlq" data-hue="#34c3e0" fill="#34c3e0"
                  x="768" y="521" text-anchor="middle">&mdash;</text>
          </g>

          <!-- ================================================================
               BAND 3 — telemetry. Every service reports downward into it.
               ================================================================ -->
          <text class="band-n" x="48" y="562">3</text>
          <text class="band" x="70" y="562">WHAT EVERY SERVICE REPORTS</text>
          <line x1="360" y1="558" x2="1060" y2="558" class="rule"/>

          <!-- One rail, three drops. Every service above feeds it, so drawing a
               line from each would add nine crossings and say nothing more. -->
          <path id="edge-telemetry-rail" class="line-quiet" d="M154 596 H1176"/>
          <text class="edge-lbl" x="1176" y="588" text-anchor="end">every service above reports here</text>
          <path id="edge-telemetry-prometheus" class="line-quiet" d="M232 596 V630" marker-end="url(#arrow-quiet)"/>
          <path id="edge-telemetry-grafana" class="line-quiet" d="M478 596 V630" marker-end="url(#arrow-quiet)"/>
          <path id="edge-telemetry-jaeger" class="line-quiet" d="M724 596 V630" marker-end="url(#arrow-quiet)"/>

          <rect class="box-soft" x="154" y="634" width="156" height="52" rx="2"/>
          <text class="name" x="232" y="659" text-anchor="middle">Prometheus</text>
          <text class="sub"  x="232" y="676" text-anchor="middle">metrics</text>

          <rect class="box-soft" x="400" y="634" width="156" height="52" rx="2"/>
          <text class="name" x="478" y="659" text-anchor="middle">Grafana</text>
          <text class="sub"  x="478" y="676" text-anchor="middle">dashboards</text>

          <rect class="box-soft" x="646" y="634" width="156" height="52" rx="2"/>
          <text class="name" x="724" y="659" text-anchor="middle">Jaeger</text>
          <text class="sub"  x="724" y="676" text-anchor="middle">traces</text>

          <!-- ================================================================
               KEY — what a line and a lamp mean.

               This used to sit at the foot of an instrument column down the
               right-hand side. Every number that column held now sits on the
               thing it measures, which left the key as the only tenant of 280
               units of width. Moved into the empty quarter beside band three,
               it costs the drawing nothing and the canvas is a fifth narrower,
               so every box on it is drawn larger at the same screen size.
               ================================================================ -->
          <text class="band" x="884" y="640">KEY</text>

          <path class="line-sync" d="M884 660 H922" marker-end="url(#arrow-sync)"/>
          <text class="sub" x="934" y="664">synchronous call</text>
          <path class="line-async" d="M884 682 H922" marker-end="url(#arrow-async)"/>
          <text class="sub" x="934" y="686">message or event</text>
          <path class="line-quiet" d="M884 704 H922"/>
          <text class="sub" x="934" y="708">telemetry</text>

          <circle cx="890" cy="726" r="5" fill="#2fd98a"/>
          <text class="sub" x="904" y="730">healthy</text>
          <circle cx="964" cy="726" r="5" fill="#ffb020"/>
          <text class="sub" x="978" y="730">degraded</text>
          <circle cx="1048" cy="726" r="5" fill="#ff4a4a"/>
          <text class="sub" x="1062" y="730">down</text>

          <!-- The honest reading of every animation on this page. It belongs
               here rather than only in the walkthrough, because someone
               watching a line light up is not reading the walkthrough. -->
          <text class="read-unt" x="884" y="752">a lit line means a message was sent along it</text>
          <text class="read-unt" x="884" y="768">pause the pointer on a number to see what it counts</text>
        </svg>
      </figure>
      <figcaption>
        Every lamp, number and moving line here is read from the running system,
        not typed in. This panel is a subscriber on the same message bus the
        services use, so a line lights the moment a message is published rather
        than whenever a measurement next happens to be taken.
        Watch the difference the platform exists to teach: one command lights a
        single line into the <b>worker</b>, because the workers share one durable
        consumer name and split the load. One event lights the
        <b>notifier</b> and <b>audit</b> lines <em>together</em>, because those two
        hold separate names and each receives its own copy.
      </figcaption>
    </div>
  </div>
</div>

<script>
  // ===========================================================================
  // The panel is told, not asked.
  //
  // This page used to poll once a second, which meant nothing on screen could
  // ever be newer than the last request. It now holds one socket open and the
  // service pushes as things happen. Three kinds of message arrive:
  //
  //   frame  the whole picture. On connect, and whenever it changes.
  //   pulse  traffic crossed the message bus. Readings are absolute values;
  //          edges are the lines to light.
  //   tick   nothing changed, and here is how fresh each claim is.
  //
  // The one recovery rule: apply a message only if its sequence number is
  // greater than the last one seen. Because readings are absolute rather than
  // increments, a browser that slept, lagged, reconnected or met a restarted
  // server all recover the same way - the next message puts it right.
  // ===========================================================================

  const COLOURS = { healthy:"#2fd98a", degraded:"#ffb020", down:"#ff4a4a", unknown:"#5a6b78" };
  const ALARM_GROUND = { healthy:"#0f1a14", degraded:"#241703", down:"#2a0f0f", unknown:"#141b21" };

  // A line stays lit this long after a message crossed it.
  const LIT_MILLISECONDS = 340;
  // How long the whole staggered command path takes to travel, left to right.
  const STAGGER_MILLISECONDS = 40;
  // Silence longer than this means the feed is gone, whatever the socket says.
  const WATCHDOG_MILLISECONDS = 3000;
  // Sampled data older than this stops being described as live.
  const LAMPS_FRESH_MILLISECONDS = 6000;

  // The lines a command travels, in order. Six of them, ending at exactly one
  // line into the worker - because one worker takes each command.
  const COMMAND_EDGES = ["edge-clients-gateway", "edge-gateway-postgres", "edge-postgres-relay",
                         "edge-relay-tag", "edge-tag-commands", "edge-commands-worker"];
  // One publish, two subscribers, lit together rather than in sequence. That
  // simultaneity is the whole difference between eventing and messaging.
  const EVENT_EDGES = ["edge-worker-events", "edge-events-notifier", "edge-events-audit"];
  const DEAD_LETTER_EDGES = ["edge-worker-deadletter"];
  // The two longest lines on the drawing, and the two that carry the lesson, so
  // they are the two that get a travelling dot rather than only a flash.
  const DOTTED_EDGES = ["edge-events-notifier", "edge-events-audit"];

  const byId = (id) => document.getElementById(id);
  const motionAllowed = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let socket = null;
  let lastSeq = -1;
  let epoch = null;
  let watchdog = null;
  let failedOpens = 0;
  let backoff = 500;
  let sampling = null;          // the polling fallback, if it ever engages
  const litUntil = new Map();   // edge identifier -> when its flash expires

  // ---------------------------------------------------------------------------
  // Painting
  // ---------------------------------------------------------------------------

  function paintNodes(nodes) {
    for (const node of nodes) {
      const lamp = byId("led-" + node.id);
      if (lamp) lamp.setAttribute("fill", COLOURS[node.status] || COLOURS.unknown);

      const detail = byId("txt-" + node.id);
      if (detail) {
        detail.textContent = node.detail;
        detail.setAttribute("fill", node.status === "healthy" ? "#6d8496" : COLOURS[node.status]);
      }

      // The outline of the worker carries its state too, so a degraded block
      // reads at a glance rather than needing the lamp to be found first.
      if (node.id === "worker") {
        const box = byId("node-worker");
        if (box) box.setAttribute("stroke", node.status === "healthy" ? "#334c5c" : COLOURS[node.status]);
      }
    }
  }

  function paintGauges(gauges) {
    for (const reading of gauges) {
      const value = byId(reading.id);
      if (!value) continue;
      value.textContent = reading.value;
      value.setAttribute("fill", reading.warn ? COLOURS.degraded : value.getAttribute("data-hue"));
      // The badge's border carries the same warning as its number. Back to the
      // reading's own hue rather than to one shared grey, because the border is
      // what says whether this count travelled the message bus or a call.
      const badge = byId("box-" + reading.id);
      if (badge) {
        badge.setAttribute("stroke", reading.warn ? COLOURS.degraded : badge.getAttribute("data-hue"));
      }
    }
    // A reading on screen inside the hover panel has just gone stale.
    if (openReading) fillTip(openReading);
  }

  function paintAlarms(alarms) {
    // Ranked, so an "unknown" alarm cannot fall through to the healthy colour.
    // A banner that says something is wrong while painting itself green is the
    // worst of both: it is noticed, and then dismissed.
    const RANK = { healthy: 0, unknown: 1, degraded: 2, down: 3 };
    const worst = alarms.reduce(
      (carried, alarm) => (RANK[alarm.severity] > RANK[carried] ? alarm.severity : carried),
      "healthy");

    const box = byId("alarm-box"), lamp = byId("alarm-led"),
          title = byId("alarm-title"), text = byId("alarm-text"), count = byId("alarm-count");

    if (alarms.length === 0) {
      box.setAttribute("stroke", COLOURS.healthy);
      box.setAttribute("fill", ALARM_GROUND.healthy);
      lamp.setAttribute("fill", COLOURS.healthy);
      title.setAttribute("fill", COLOURS.healthy);
      title.textContent = "ALL CLEAR";
      text.textContent = "no active alarms";
      text.setAttribute("fill", "#c7d8e4");
      count.textContent = "0 ACTIVE";
    } else {
      const hue = COLOURS[worst] || COLOURS.degraded;
      box.setAttribute("stroke", hue);
      box.setAttribute("fill", ALARM_GROUND[worst] || ALARM_GROUND.degraded);
      lamp.setAttribute("fill", hue);
      title.setAttribute("fill", hue);
      title.textContent = worst === "down" ? "ALARM" : "WARNING";
      text.textContent = alarms[0].text;
      text.setAttribute("fill", "#e6eef4");
      count.textContent = alarms.length + " ACTIVE";
    }
  }

  function paint(state) {
    paintNodes(state.nodes);
    paintGauges(state.gauges);
    paintAlarms(state.alarms);
  }

  // ---------------------------------------------------------------------------
  // Motion
  //
  // Every gate below is load-bearing rather than polish. A hidden tab painting
  // animations, or five hundred dots for five hundred orders, is how a panel
  // becomes the reason a laptop fan spins up.
  // ---------------------------------------------------------------------------

  function light(edgeId) {
    const line = byId(edgeId);
    if (!line) return;

    line.classList.add("lit");
    litUntil.set(edgeId, Date.now() + LIT_MILLISECONDS);

    if (motionAllowed && line.classList.contains("line-async")) {
      line.classList.add("flowing");
    }

    window.setTimeout(() => {
      // Another message may have arrived meanwhile and pushed the expiry out.
      if ((litUntil.get(edgeId) || 0) <= Date.now()) {
        line.classList.remove("lit", "flowing");
        litUntil.delete(edgeId);
      }
    }, LIT_MILLISECONDS + 20);
  }

  /// Sends one dot along a real path, using the path itself as the route.
  ///
  /// `mpath` references the drawn element, so the geometry is never duplicated
  /// into a stylesheet that then has to be kept in step by hand. No rotation:
  /// these are right-angled polylines and a rotating marker snaps at each corner.
  function sendDot(edgeId) {
    if (!motionAllowed) return;
    const line = byId(edgeId);
    if (!line) return;

    const svg = line.ownerSVGElement;
    const namespace = "http://www.w3.org/2000/svg";

    const dot = document.createElementNS(namespace, "circle");
    dot.setAttribute("r", "4");
    dot.setAttribute("fill", "#d9c2ff");
    // Decorative. The drawing carries a written description for anyone who
    // cannot see it, and moving dots must not enter that description.
    dot.setAttribute("aria-hidden", "true");

    const motion = document.createElementNS(namespace, "animateMotion");
    motion.setAttribute("dur", "0.5s");
    motion.setAttribute("fill", "remove");

    const route = document.createElementNS(namespace, "mpath");
    route.setAttribute("href", "#" + edgeId);

    motion.appendChild(route);
    dot.appendChild(motion);
    svg.appendChild(dot);

    motion.addEventListener("endEvent", () => dot.remove());
    // A tab hidden mid-flight never fires endEvent, so remove it regardless.
    window.setTimeout(() => dot.remove(), 900);
  }

  function animate(edges) {
    if (document.visibilityState !== "visible") return;

    const touched = new Set(edges.map((edge) => edge.id));

    // A command path is staggered left to right. That is honest as well as
    // legible: the tap observes the relay's publish, so the upstream hops
    // genuinely did happen a moment earlier.
    if (touched.has("edge-commands-worker")) {
      COMMAND_EDGES.forEach((edgeId, position) => {
        window.setTimeout(() => light(edgeId), position * STAGGER_MILLISECONDS);
      });
    }

    // An event lights all three of its lines from the same message, so the two
    // subscriber lines start together. One event, two copies, at once.
    if (touched.has("edge-worker-events")) {
      EVENT_EDGES.forEach(light);
      DOTTED_EDGES.forEach(sendDot);
    }

    DEAD_LETTER_EDGES.forEach((edgeId) => {
      if (touched.has(edgeId)) light(edgeId);
    });
  }

  // ---------------------------------------------------------------------------
  // The hover panel on a reading
  //
  // A badge holds four characters. Everything the instrument column used to say
  // in words - the name, the unit, and what the number actually counts - is
  // here, and appears when the pointer is *paused* on a badge rather than the
  // instant it passes over one. Crossing the diagram to reach something else
  // should not leave three panels flashing in its wake.
  // ---------------------------------------------------------------------------

  // Long enough that crossing a badge is not "pausing" on it, short enough that
  // deliberately stopping does not feel broken.
  const HOVER_PAUSE_MILLISECONDS = 320;

  let openReading = null;   // the <g class="rd"> the panel is describing
  let hoverTimer = null;

  function fillTip(group) {
    const value = group.querySelector(".rd-val");
    byId("tip-title").textContent = group.dataset.title;
    byId("tip-value").textContent = value ? value.textContent : "—";
    byId("tip-value").style.color = value ? value.getAttribute("fill") : "";
    byId("tip-unit").textContent = group.dataset.unit;
    byId("tip-note").textContent = group.dataset.note;
  }

  function showTip(group) {
    const tip = byId("tip");
    openReading = group;
    fillTip(group);
    tip.hidden = false;

    // Measured after unhiding, because a hidden element has no size. Both
    // rectangles are in viewport coordinates, so a horizontally scrolled
    // diagram needs no correction of its own.
    const frame = document.querySelector(".bezel").getBoundingClientRect();
    const badge = group.getBoundingClientRect();

    let left = badge.left - frame.left + badge.width / 2 - tip.offsetWidth / 2;
    let top = badge.top - frame.top - tip.offsetHeight - 10;

    // Not enough room above: drop it below the badge rather than off the top.
    if (top < 4) top = badge.bottom - frame.top + 10;
    left = Math.max(4, Math.min(left, frame.width - tip.offsetWidth - 4));

    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }

  function hideTip() {
    window.clearTimeout(hoverTimer);
    openReading = null;
    byId("tip").hidden = true;
  }

  for (const group of document.querySelectorAll(".rd")) {
    // The badge itself reads as four characters with no context, so it is named
    // here from the same two attributes the hover panel uses. Built rather than
    // written into the markup, so the name and the panel cannot drift apart.
    group.setAttribute("aria-label", group.dataset.title + ", " + group.dataset.unit);

    group.addEventListener("mouseenter", () => {
      window.clearTimeout(hoverTimer);
      hoverTimer = window.setTimeout(() => showTip(group), HOVER_PAUSE_MILLISECONDS);
    });
    group.addEventListener("mouseleave", hideTip);
    // No pause on the keyboard path: arriving by Tab is already deliberate.
    group.addEventListener("focus", () => showTip(group));
    group.addEventListener("blur", hideTip);
  }

  // Escape closes it, which is the one thing a keyboard user cannot otherwise
  // do without moving focus off the reading they are reading about.
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") hideTip();
  });

  // ---------------------------------------------------------------------------
  // The three indicators
  // ---------------------------------------------------------------------------

  function showConnection(label, stale) {
    const connection = byId("connection");
    // Rewriting the markup restarts the heartbeat animation, which keeps it in
    // step with the messages rather than free-running.
    connection.innerHTML = '<span id="beat">&#9679;</span> ' + label;
    connection.className = stale ? "stale" : "";
  }

  function showAges(tick) {
    const lamps = byId("age-lamps");
    if (tick.prometheus_age_milliseconds < LAMPS_FRESH_MILLISECONDS) {
      lamps.textContent = "live";
      lamps.style.color = "";
    } else {
      lamps.textContent = Math.round(tick.prometheus_age_milliseconds / 1000) + " seconds ago";
      lamps.style.color = COLOURS.degraded;
    }

    const flow = byId("age-flow");
    flow.textContent = tick.live_ok ? "live" : "not connected";
    flow.style.color = tick.live_ok ? "" : COLOURS.degraded;
    // The time since the last message belongs here rather than in the headline.
    // On a genuinely idle system that number is large and perfectly healthy, and
    // putting it on the strip would train people to ignore an amber panel.
    flow.title = tick.last_message_age_milliseconds === null
      ? "no message seen since this panel started"
      : "last message " + Math.round(tick.last_message_age_milliseconds / 1000) + " seconds ago";
  }

  // ---------------------------------------------------------------------------
  // The feed
  // ---------------------------------------------------------------------------

  function handle(message) {
    // A restarted server means the numbering starts again and this browser's
    // held value means nothing. Same recovery either way; only one deserves a
    // log line.
    if (epoch !== null && message.epoch !== epoch && message.epoch !== "00000000-0000-0000-0000-000000000000") {
      console.info("[mimic] the service restarted; resynchronising");
      lastSeq = -1;
    }
    if (message.epoch !== "00000000-0000-0000-0000-000000000000") epoch = message.epoch;

    // A frame sent on connect or after a lag carries sequence 0 deliberately:
    // it is a fresh whole picture and always applies.
    if (message.seq !== 0 && message.seq <= lastSeq) return;
    if (message.seq !== 0) lastSeq = message.seq;

    if (message.type === "frame") {
      paint(message.state);
    } else if (message.type === "pulse") {
      paintGauges(message.gauges);
      animate(message.edges);
    } else if (message.type === "tick") {
      showAges(message);
      showConnection("LIVE", false);
    }
  }

  // A socket that half-opens produces silence, not an error - no event fires at
  // all. The socket's own error handling therefore cannot be the only guard.
  // Never blank the panel: an empty screen is indistinguishable from a healthy
  // system with nothing happening.
  // Silence is the failure mode a socket cannot report: a half-open connection
  // fires no event at all. The watchdog both says so and *acts* - relabelling
  // alone would leave the panel permanently frozen with an honest label, which
  // is only half a fix.
  function armWatchdog() {
    window.clearTimeout(watchdog);
    watchdog = window.setTimeout(() => {
      goStale();
      // Tear the silent socket down so onclose runs the normal reconnect.
      // Never blank the picture: the last good one stays on screen.
      if (socket) socket.close();
    }, WATCHDOG_MILLISECONDS);
  }

  // When the feed stops, every claim it was carrying stops being true. Leaving
  // the ages reading "live" from the last tick received would keep asserting
  // freshness that nothing is refreshing.
  function goStale() {
    showConnection("NO FEED", true);
    for (const id of ["age-lamps", "age-flow"]) {
      const element = byId(id);
      element.textContent = "unknown";
      element.style.color = COLOURS.degraded;
    }
  }

  function connect() {
    if (sampling) return;
    // Without this guard, a wake-from-sleep can run connect() while a socket is
    // still open, orphaning one whose handlers keep firing into the same page.
    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;

    const scheme = location.protocol === "https:" ? "wss://" : "ws://";
    const opening = new WebSocket(scheme + location.host + "/api/live");
    socket = opening;

    opening.onopen = () => {
      // Reset here rather than on the first message: the socket opened, so
      // whatever failed before is not structural.
      failedOpens = 0;
      backoff = 500;
      showConnection("LIVE", false);
      armWatchdog();
    };

    opening.onmessage = (event) => {
      armWatchdog();
      try {
        handle(JSON.parse(event.data));
      } catch (error) {
        console.warn("[mimic] could not read a message", error);
      }
    };

    opening.onclose = () => {
      // A stale handler from an orphaned socket must not drive reconnection.
      if (socket !== opening) return;

      goStale();

      // Only an open that never succeeded counts towards giving up. A socket
      // that opened and later closed is an ordinary restart, and counting
      // those would downgrade the panel to sampling forever after three
      // service restarts - which it would then never recover from.
      if (opening.readyState === WebSocket.CLOSED && !opening.hadOpened) {
        failedOpens += 1;
      }

      // Three failures to *open* suggests something structural - a proxy
      // stripping the upgrade header, most often - so fall back to asking.
      if (failedOpens >= 3) {
        startSampling();
        return;
      }

      // Jitter, so twenty tabs waking from a suspended machine do not all
      // reconnect in the same instant.
      const jittered = backoff * (0.8 + Math.random() * 0.4);
      window.setTimeout(connect, jittered);
      backoff = Math.min(backoff * 2, 10000);
    };

    opening.addEventListener("open", () => { opening.hadOpened = true; });
    opening.onerror = () => opening.close();
  }

  // The reason /api/state is kept rather than deprecated.
  //
  // Sampling is a fallback, not a destination: every thirty seconds it tries
  // the socket again. A proxy is reconfigured, a service is restarted, a
  // network changes - and a panel that had quietly settled into one-second
  // polling with no animation would never notice it could do better.
  function startSampling() {
    if (sampling) return;
    console.info("[mimic] falling back to sampling; the socket would not open");
    showConnection("SAMPLED", true);

    sampling = window.setInterval(async () => {
      try {
        const response = await fetch("/api/state", { cache: "no-store" });
        if (!response.ok) throw new Error(response.status);
        paint(await response.json());
        showConnection("SAMPLED", true);
      } catch {
        showConnection("NO FEED", true);
      }
    }, 1000);

    window.setTimeout(stopSampling, 30000);
  }

  function stopSampling() {
    if (!sampling) return;
    window.clearInterval(sampling);
    sampling = null;
    failedOpens = 0;
    backoff = 500;
    connect();
  }

  // A sleeping laptop is the case where the socket is dead and nothing said so.
  // A suspended machine's socket often reads as OPEN while being long dead, so
  // re-arming the watchdog is what actually recovers it: three seconds of
  // silence then tears it down and reconnects. Calling connect() alone would
  // return immediately against that apparently-open socket.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (sampling) return;

    backoff = 500;
    failedOpens = 0;

    if (!socket || socket.readyState === WebSocket.CLOSED) {
      connect();
    } else {
      armWatchdog();
    }
  });

  connect();
  armWatchdog();
</script>
</body>
</html>
