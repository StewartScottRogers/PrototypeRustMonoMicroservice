<title>Mimic Panel — Order Platform</title>
<style>
  /* A control room commits to one visual world, so every colour is painted
     explicitly rather than inherited. */
  :root {
    --void:#05080b; --ground:#080d12; --panel:#0d151c; --panel-2:#101a22;
    --edge:#263945; --edge-hi:#3a5464;
    --ink:#c7d8e4; --dim:#6d8496; --far:#4a5f6e;
    --ok:#2fd98a; --warn:#ffb020; --fail:#ff4a4a; --unknown:#5a6b78;
    --sync:#34c3e0; --async:#b07cff;
    --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}
  body{background:var(--void);color:var(--ink);font-family:var(--mono);margin:0;padding:1.5rem 1rem 3rem;-webkit-font-smoothing:antialiased}
  .shell{max-width:88rem;margin:0 auto}
  .strip{display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;justify-content:space-between;align-items:baseline;
         padding:.4rem .5rem .8rem;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--far)}
  .strip b{color:var(--dim);font-weight:500}
  #conn{color:var(--ok)}
  #conn.stale{color:var(--warn)}
  .bezel{background:var(--ground);border:1px solid var(--edge);box-shadow:0 0 0 1px #000 inset,0 24px 60px -30px #000;padding:.6rem}
  .scroller{overflow-x:auto}
  svg{display:block;width:100%;min-width:64rem;height:auto}
  figure{margin:0}
  figcaption{margin:1rem auto 0;max-width:58rem;font-size:.78rem;line-height:1.7;color:var(--dim);text-align:center;text-wrap:pretty}
  figcaption b{color:var(--ink);font-weight:500}
  @media (prefers-reduced-motion:no-preference){
    .pulse{animation:blink 1.4s steps(1,end) infinite}
    @keyframes blink{50%{opacity:.25}}
  }
</style>
</head>

  <figcaption>
    Every lamp and number here is read from the running system, not typed in.
    <b>Worker</b> shares one durable consumer name so the load splits between its
    replicas; <b>notifier</b> and <b>audit</b> hold separate names, so each receives
    every event. That single difference is why one of those rates halves when you
    scale and the others do not.
  </figcaption>

<script>
  // Polls the service, which polls Prometheus. One collector serves every open
  // tab, so a wall display costs the same as a single visitor.
  const COLOURS = { healthy:"#2fd98a", degraded:"#ffb020", down:"#ff4a4a", unknown:"#5a6b78" };
  const ALARM_GROUND = { healthy:"#0f1a14", degraded:"#241703", down:"#2a0f0f", unknown:"#141b21" };

  const $ = (id) => document.getElementById(id);

  function paint(state) {
    for (const node of state.nodes) {
      const led = $("led-" + node.id);
      if (led) led.setAttribute("fill", COLOURS[node.status] || COLOURS.unknown);
      const txt = $("txt-" + node.id);
      if (txt) {
        txt.textContent = node.detail;
        txt.setAttribute("fill", node.status === "healthy" ? "#6d8496" : COLOURS[node.status]);
      }
      // The worker's outline carries its state too, so a degraded block reads
      // at a glance rather than needing the lamp to be found first.
      if (node.id === "worker") {
        const box = $("node-worker");
        if (box) box.setAttribute("stroke", node.status === "healthy" ? "#3a5464" : COLOURS[node.status]);
      }
    }

    for (const gauge of state.gauges) {
      const el = $(gauge.id);
      if (!el) continue;
      el.textContent = gauge.value;
      el.setAttribute("fill", gauge.warn ? COLOURS.degraded : el.getAttribute("data-hue") || "#34c3e0");
      const box = $("box-" + gauge.id);
      if (box) box.setAttribute("stroke", gauge.warn ? COLOURS.degraded : "#263945");
    }

    const worst = state.alarms.reduce((acc, alarm) =>
      alarm.severity === "down" ? "down"
        : (acc === "down" ? acc : (alarm.severity === "degraded" ? "degraded" : acc)), "healthy");

    const box = $("alarm-box"), led = $("alarm-led"),
          title = $("alarm-title"), text = $("alarm-text"), count = $("alarm-count");

    if (state.alarms.length === 0) {
      box.setAttribute("stroke", COLOURS.healthy);
      box.setAttribute("fill", ALARM_GROUND.healthy);
      led.setAttribute("fill", COLOURS.healthy);
      title.setAttribute("fill", COLOURS.healthy);
      title.textContent = "ALL CLEAR";
      text.textContent = "no active alarms";
      text.setAttribute("fill", "#c7d8e4");
      count.textContent = "0 ACTIVE";
    } else {
      const hue = COLOURS[worst] || COLOURS.degraded;
      box.setAttribute("stroke", hue);
      box.setAttribute("fill", ALARM_GROUND[worst] || ALARM_GROUND.degraded);
      led.setAttribute("fill", hue);
      title.setAttribute("fill", hue);
      title.textContent = worst === "down" ? "ALARM" : "WARNING";
      text.textContent = state.alarms[0].text;
      text.setAttribute("fill", "#e6eef4");
      count.textContent = state.alarms.length + " ACTIVE";
    }

    $("stamp").textContent = new Date(state.generated_at).toLocaleTimeString();
    const conn = $("conn");
    conn.textContent = state.sources_ok ? "LIVE" : "SOURCE LOST";
    conn.className = state.sources_ok ? "" : "stale";
  }

  async function tick() {
    try {
      const response = await fetch("/api/state", { cache: "no-store" });
      if (!response.ok) throw new Error(response.status);
      paint(await response.json());
    } catch {
      // A failed poll must not blank the panel. Keep the last good picture and
      // say the feed is stale - an empty screen is indistinguishable from a
      // healthy system with nothing happening.
      const conn = $("conn");
      conn.textContent = "NO FEED";
      conn.className = "stale";
    }
  }

  tick();
  setInterval(tick, 3000);
</script>
</body>
</html>
