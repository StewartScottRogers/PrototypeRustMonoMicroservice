<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Mimic — Order Platform</title>
<style>
  /* A control room commits to one visual world, so every colour is painted
     explicitly rather than inherited from whatever is framing the page. */
  :root {
    --void:#05080b; --ground:#080d12; --panel:#0d151c; --panel-2:#101a22;
    --edge:#22333e; --edge-hi:#334c5c;
    --ink:#c7d8e4; --dim:#6d8496; --far:#42555f;
    --ok:#2fd98a; --warn:#ffb020; --fail:#ff4a4a; --unknown:#5a6b78;
    --sync:#34c3e0; --async:#b07cff;
    --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}
  body{background:var(--void);color:var(--ink);font-family:var(--mono);margin:0;
       padding:1.25rem 1rem 2.5rem;-webkit-font-smoothing:antialiased}
  .shell{max-width:96rem;margin:0 auto}
  .strip{display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;justify-content:space-between;align-items:baseline;
         padding:.3rem .4rem .7rem;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--far)}
  .strip b{color:var(--dim);font-weight:500}
  #connection{color:var(--ok)}
  #connection.stale{color:var(--warn)}
  .bezel{background:var(--ground);border:1px solid var(--edge);
         box-shadow:0 0 0 1px #000 inset,0 24px 60px -30px #000;padding:.5rem}
  .scroller{overflow-x:auto}
  svg{display:block;width:100%;min-width:72rem;height:auto}
  figure{margin:0}
  figcaption{margin:.9rem auto 0;max-width:60rem;font-size:.78rem;line-height:1.7;
             color:var(--dim);text-align:center;text-wrap:pretty}
  figcaption b{color:var(--ink);font-weight:500}
  @media (prefers-reduced-motion:no-preference){
    /* A one-second heartbeat on the live indicator, matching the poll, so a
       frozen panel is obvious without reading the timestamp. */
    #beat{animation:beat 1s steps(1,end) infinite}
    @keyframes beat{50%{opacity:.2}}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="strip">
    <span>Order Platform &middot; <b>Live Mimic</b></span>
    <span>Updated <b id="stamp">&mdash;</b> &middot; <span id="connection"><span id="beat">&#9679;</span> LIVE</span></span>
  </div>

  <div class="bezel">
    <div class="scroller">
      <figure>
        <svg viewBox="0 0 1500 812" role="img"
             aria-label="Live mimic of the order platform, read left to right and then top to bottom. Band one: clients post an order to the gateway service, which writes the order and an outbox row to PostgreSQL in one transaction, and the outbox relay polls that table. The gateway also calls the echo service synchronously as a simple example. Band two: the relay publishes to the command stream on the NATS JetStream broker, one worker replica takes each command, and the worker publishes to the event stream, which every subscriber reads a copy of, so both the notifier and the audit service react. Redis holds idempotency keys and repeatedly failing messages are parked on the dead-letter stream. Band three: Prometheus, Grafana and Jaeger receive telemetry from every service. An instrument column on the right shows live rates and depths.">
          <defs>
            <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#34c3e0"/></marker>
            <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#b07cff"/></marker>
            <marker id="arrow-quiet" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#5c7382"/></marker>
          </defs>

          <style>
            .box      { fill:#0d151c; stroke:#334c5c; stroke-width:1.4; }
            .box-soft { fill:#0a1118; stroke:#22333e; stroke-width:1.2; }
            .box-tag  { fill:#0a1118; stroke:#334c5c; stroke-width:1.2; stroke-dasharray:3 3; }
            .tile     { fill:#0d151c; stroke:#22333e; stroke-width:1.2; }
            .name     { font-family:inherit; font-size:14px; fill:#c7d8e4; letter-spacing:.04em; }
            .sub      { font-family:inherit; font-size:10.5px; fill:#6d8496; }
            .detail   { font-family:inherit; font-size:10.5px; fill:#6d8496; }
            .band     { font-family:inherit; font-size:11px; fill:#6d8496; letter-spacing:.2em; }
            .band-n   { font-family:inherit; font-size:11px; fill:#34c3e0; letter-spacing:.2em; }
            .edge-lbl { font-family:inherit; font-size:10px; fill:#5c7382; letter-spacing:.02em; }
            .line-sync  { stroke:#34c3e0; stroke-width:1.6; fill:none; }
            .line-async { stroke:#b07cff; stroke-width:1.6; fill:none; stroke-dasharray:7 5; }
            .line-quiet { stroke:#5c7382; stroke-width:1.2; fill:none; stroke-dasharray:2 4; }
            .rule     { stroke:#1a2831; stroke-width:1; }
            .tag-txt  { font-family:inherit; font-size:12px; fill:#34c3e0; letter-spacing:.1em; }
            .read-lbl { font-family:inherit; font-size:10.5px; fill:#6d8496; letter-spacing:.08em; }
            .read-val { font-family:inherit; font-size:23px; fill:#34c3e0; }
            .read-unt { font-family:inherit; font-size:10px; fill:#42555f; }
          </style>

          <!-- ============ ALARM BANNER ============ -->
          <rect id="alarm-box" x="40" y="20" width="1420" height="52" rx="2"
                fill="#0f1a14" stroke="#2fd98a" stroke-width="1.4"/>
          <circle id="alarm-led" cx="70" cy="46" r="7" fill="#2fd98a"/>
          <text id="alarm-title" x="96" y="51" font-size="12" fill="#2fd98a" letter-spacing="2.4">ALL CLEAR</text>
          <line x1="212" y1="30" x2="212" y2="62" class="rule"/>
          <text id="alarm-text" x="234" y="51" font-size="13" fill="#c7d8e4">no active alarms</text>
          <text id="alarm-count" x="1436" y="51" font-size="11" fill="#6d8496" text-anchor="end">0 ACTIVE</text>

          <!-- ================================================================
               BAND 1 — accept and store. Reads left to right.
               ================================================================ -->
          <text class="band-n" x="48" y="106">1</text>

          <line x1="392" y1="102" x2="1060" y2="102" class="rule"/>

          <!-- clients -->
          <rect class="box-soft" x="48" y="136" width="150" height="66" rx="2"/>
          <text class="name" x="123" y="167" text-anchor="middle">Clients</text>
          <text class="sub"  x="123" y="185" text-anchor="middle">curl or DevDemo.cmd</text>

          <text class="edge-lbl" x="221" y="128" text-anchor="middle">place an order</text>

          <!-- gateway -->

          <text class="edge-lbl" x="466" y="128" text-anchor="middle">one transaction</text>

          <!-- postgresql -->

          <circle id="led-postgres" cx="673" cy="150" r="6" fill="#5a6b78"/>

          <text id="txt-postgres" class="detail" x="581" y="185" text-anchor="middle">&mdash;</text>

          <path class="line-async" d="M934 169 H986" marker-end="url(#arrow-async)"/>

          <!-- continuation tag: leaves band 1 -->

          <!-- the synchronous side example, hanging below the gateway -->

          <text class="band-n" x="48" y="352">2</text>

          <path class="line-quiet" d="M232 596 V630" marker-end="url(#arrow-quiet)"/>
          <path class="line-quiet" d="M478 596 V630" marker-end="url(#arrow-quiet)"/>
          <path class="line-quiet" d="M724 596 V630" marker-end="url(#arrow-quiet)"/>

          <rect class="box-soft" x="154" y="634" width="156" height="52" rx="2"/>

          <text class="name" x="478" y="659" text-anchor="middle">Grafana</text>
          <text class="sub"  x="478" y="676" text-anchor="middle">dashboards</text>

          <rect class="box-soft" x="646" y="634" width="156" height="52" rx="2"/>
          <text class="name" x="724" y="659" text-anchor="middle">Jaeger</text>

               ================================================================ -->

          <text class="band" x="1240" y="116">READINGS</text>

          <rect class="tile" id="box-g-accepted" x="1240" y="132" width="220" height="62" rx="2"/>
          <text class="read-lbl" x="1256" y="154">ORDERS ACCEPTED</text>
          <text class="read-unt" x="1256" y="180">per second</text>
          <text class="read-val" id="g-accepted" data-hue="#34c3e0" x="1444" y="182" text-anchor="end">&mdash;</text>

          <rect class="tile" id="box-g-relayed" x="1240" y="202" width="220" height="62" rx="2"/>
          <text class="read-lbl" x="1256" y="224">OUTBOX ROWS PUBLISHED</text>
          <text class="read-unt" x="1256" y="250">per second</text>
          <text class="read-val" id="g-relayed" data-hue="#b07cff" x="1444" y="252" text-anchor="end">&mdash;</text>

          <rect class="tile" id="box-g-processed" x="1240" y="272" width="220" height="62" rx="2"/>
          <text class="read-lbl" x="1256" y="294">ORDERS PROCESSED</text>
          <text class="read-unt" x="1256" y="320">per second</text>
          <text class="read-val" id="g-processed" data-hue="#b07cff" x="1444" y="322" text-anchor="end">&mdash;</text>

          <rect class="tile" id="box-g-notified" x="1240" y="342" width="220" height="62" rx="2"/>
          <text class="read-lbl" x="1256" y="364">NOTIFICATIONS HANDLED</text>

          <text class="read-val" id="g-notified" data-hue="#b07cff" x="1444" y="392" text-anchor="end">&mdash;</text>

          <rect class="tile" id="box-g-audited" x="1240" y="412" width="220" height="62" rx="2"/>
          <text class="read-lbl" x="1256" y="434">AUDIT EVENTS HANDLED</text>
          <text class="read-unt" x="1256" y="460">per second</text>
          <text class="read-val" id="g-audited" data-hue="#b07cff" x="1444" y="462" text-anchor="end">&mdash;</text>

          <rect class="tile" id="box-g-dlq" x="1240" y="552" width="220" height="62" rx="2"/>

          <text class="read-lbl" x="1256" y="644">SLOWEST ONE IN A HUNDRED</text>
          <text class="read-unt" x="1256" y="670">milliseconds to process</text>
          <text class="read-val" id="g-p99" data-hue="#34c3e0" x="1444" y="672" text-anchor="end">&mdash;</text>

          <!-- legend: lines first, then what a lamp colour means -->
          <text class="band" x="1240" y="712">KEY</text>

          <path class="line-sync" d="M1240 730 H1278" marker-end="url(#arrow-sync)"/>
          <text class="sub" x="1290" y="734">synchronous call</text>
          <path class="line-async" d="M1240 752 H1278" marker-end="url(#arrow-async)"/>
          <text class="sub" x="1290" y="756">message or event</text>
          <path class="line-quiet" d="M1240 774 H1278"/>
          <text class="sub" x="1290" y="778">telemetry</text>

          <circle cx="1246" cy="796" r="5" fill="#2fd98a"/>
          <text class="sub" x="1260" y="800">healthy</text>
          <circle cx="1320" cy="796" r="5" fill="#ffb020"/>
          <text class="sub" x="1334" y="800">degraded</text>

        </svg>
      </figure>
      <figcaption>
        Every lamp and number here is read from the running system, not typed in.
        The <b>worker</b> shares one durable consumer name, so the load splits
        between its replicas; the <b>notifier</b> and the <b>audit</b> service hold
        separate names, so each receives every event. That single difference is why
        one of those readings halves when you scale and the others do not.
      </figcaption>
    </div>
  </div>
</div>

<script>
  // Polls this service, which polls Prometheus. One collector serves every open
  // tab, so a wall display costs the same as a single visitor.
  //
  // One second, matching the collector behind it. Prometheus scrapes every two
  // seconds, so a change reaches this screen in about three seconds.
  const POLL_MILLISECONDS = 1000;

  const COLOURS = { healthy:"#2fd98a", degraded:"#ffb020", down:"#ff4a4a", unknown:"#5a6b78" };
  const ALARM_GROUND = { healthy:"#0f1a14", degraded:"#241703", down:"#2a0f0f", unknown:"#141b21" };

  const byId = (id) => document.getElementById(id);

  function paint(state) {
    for (const node of state.nodes) {
      const lamp = byId("led-" + node.id);
      if (lamp) lamp.setAttribute("fill", COLOURS[node.status] || COLOURS.unknown);

      const detail = byId("txt-" + node.id);
      if (detail) {
        detail.textContent = node.detail;
        detail.setAttribute("fill", node.status === "healthy" ? "#6d8496" : COLOURS[node.status]);
      }

      // The outline of the worker carries its state too, so a degraded block
      // reads at a glance rather than needing the lamp to be found first.
      if (node.id === "worker") {
        const box = byId("node-worker");
        if (box) box.setAttribute("stroke", node.status === "healthy" ? "#334c5c" : COLOURS[node.status]);
      }
    }

    for (const reading of state.gauges) {
      const value = byId(reading.id);
      if (!value) continue;
      value.textContent = reading.value;
      value.setAttribute("fill", reading.warn ? COLOURS.degraded : value.getAttribute("data-hue"));
      const tile = byId("box-" + reading.id);
      if (tile) tile.setAttribute("stroke", reading.warn ? COLOURS.degraded : "#22333e");
    }

    const worst = state.alarms.reduce((carried, alarm) =>
      alarm.severity === "down" ? "down"
        : (carried === "down" ? carried : (alarm.severity === "degraded" ? "degraded" : carried)), "healthy");

    const box = byId("alarm-box"), lamp = byId("alarm-led"),
          title = byId("alarm-title"), text = byId("alarm-text"), count = byId("alarm-count");

    if (state.alarms.length === 0) {
      box.setAttribute("stroke", COLOURS.healthy);
      box.setAttribute("fill", ALARM_GROUND.healthy);
      lamp.setAttribute("fill", COLOURS.healthy);
      title.setAttribute("fill", COLOURS.healthy);
      title.textContent = "ALL CLEAR";
      text.textContent = "no active alarms";
      text.setAttribute("fill", "#c7d8e4");
      count.textContent = "0 ACTIVE";
    } else {
      const hue = COLOURS[worst] || COLOURS.degraded;
      box.setAttribute("stroke", hue);
      box.setAttribute("fill", ALARM_GROUND[worst] || ALARM_GROUND.degraded);
      lamp.setAttribute("fill", hue);
      title.setAttribute("fill", hue);
      title.textContent = worst === "down" ? "ALARM" : "WARNING";
      text.textContent = state.alarms[0].text;
      text.setAttribute("fill", "#e6eef4");
      count.textContent = state.alarms.length + " ACTIVE";
    }

    byId("stamp").textContent = new Date(state.generated_at).toLocaleTimeString();
    const connection = byId("connection");
    connection.innerHTML = state.sources_ok
      ? '<span id="beat">&#9679;</span> LIVE'
      : '<span id="beat">&#9679;</span> SOURCE LOST';
    connection.className = state.sources_ok ? "" : "stale";
  }

  async function tick() {
    try {
      const response = await fetch("/api/state", { cache: "no-store" });
      if (!response.ok) throw new Error(response.status);
      paint(await response.json());
    } catch {
      // A failed poll must not blank the panel. Keep the last good picture and
      // say the feed is stale - an empty screen is indistinguishable from a
      // healthy system with nothing happening.
      const connection = byId("connection");
      connection.textContent = "NO FEED";
      connection.className = "stale";
    }
  }

  tick();
  setInterval(tick, POLL_MILLISECONDS);
</script>
</body>
</html>
