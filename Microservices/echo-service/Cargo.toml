[package]
name = "echo-service"
description = "Reference microservice: proves the workspace, the CI gate, and the container build end to end."
# Each crate carries its own version number instead of inheriting the workspace
# one. release-plz bumps only the crates whose files actually changed, so
# worker-service can reach 0.2.0 while echo-service stays at 0.1.0. Note that
# inheritance is per key: every other line here still says `key.workspace = true`,
# meaning "take this value from [workspace.package] in the root Cargo.toml".
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
metrics.workspace = true
serde.workspace = true
service-core.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
# Only the contract tests need this. The service itself never touches JSON
# directly - axum's `Json` extractor does it - so it stays a dev-dependency
# and never reaches the shipped binary.
serde_json.workspace = true
tower.workspace = true
