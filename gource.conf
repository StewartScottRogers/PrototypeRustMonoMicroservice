# Gource settings for this repository.
#
# Gource (https://github.com/acaudwell/Gource) replays the version control
# history as an animated tree: directories are branches, files are dots that
# flash when someone touches them, and each contributor is a figure moving
# between them. It is the fastest way to see where the work has actually gone.
#
# This one file is read by both DevGource.cmd and .github/workflows/gource.yml,
# so the video the workflow renders looks exactly like the window on your own
# machine. Everything here can be overridden on the command line, because a
# later argument wins over the configuration file.
#
# The option names are the long command-line options with the leading "--"
# removed. `gource --help` lists every one of them.

[gource]

title=PrototypeRustMonoMicroservice

# How long one day of history lasts on screen. This is the knob to turn when
# the video is the wrong length: the history is short today, so a day is given
# a generous 20 seconds. Halve it once there are months of commits.
seconds-per-day=20

# Jump the clock forward when nothing happens for a while, so a quiet weekend
# does not become a quiet minute of video.
auto-skip-seconds=0.5

# Never retire a file from the tree. The default drops a file from view once it
# has been idle for a while, which is right for a repository with tens of
# thousands of files and wrong for this one - here the whole point is watching
# the shape of the service tree build up and stay built.
file-idle-time=0

# How long a file may lag behind its commit before Gource gives up waiting and
# draws it anyway. Low, because a single commit here often touches a dozen
# files across several crates and they should light up together.
max-file-lag=0.2

# The legend down the side, colouring files by extension. With Rust, Yaml,
# Markdown, Structured Query Language and C# all in one tree, this is what makes
# the picture readable rather than decorative.
key=true

# The clock, so a viewer can tell how fast the history is moving.
date-format=%A %d %B %Y

# Give a directory two levels of name before it is abbreviated, so
# "Microservices/worker-service" stays legible instead of collapsing to
# something unrecognisable.
dir-name-depth=2

# Contributors are drawn as a plain labelled figure. No avatar images are
# fetched: that would mean a network call per contributor from a build runner,
# for a picture nobody needs to identify two people by face.
highlight-users=true

# The bloom is Gource's glow effect. The default is strong enough to wash out
# the file names on a bright display; these values keep the glow without losing
# the labels underneath it.
bloom-multiplier=0.6
bloom-intensity=0.4

background-colour=0A0E14

# Noise removal. The mouse pointer has no business in a rendered video, and the
# progress bar is meaningless once the video is a fixed length.
hide=mouse,progress

# Directories that are build output or tool state rather than work anyone did.
# They are not committed today, but a stray one would otherwise dominate the
# picture. This is a regular expression matched against the full path.
file-filter=(^|/)(target|bin|obj|node_modules|\.vs)/
