# Loads any dashboard JSON dropped into observability/grafana/dashboards.
#
# Dashboards live in version control rather than in Grafana's database, so a
# change is reviewable in a pull request like anything else - and DevRemove.cmd
# cannot delete work by wiping a volume.

apiVersion: 1

providers:
  - name: prototype
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    # Picks up edits without a restart, so iterating on a panel is quick.
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
