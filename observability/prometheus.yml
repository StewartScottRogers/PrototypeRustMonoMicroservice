# What Prometheus scrapes, and how often.
#
# 5s is far more frequent than production would use - 15-60s is normal there.
# It is set low deliberately: a demo you have to wait a minute to see react is
# not a demo.

global:
  # Two seconds, because the mimic panel is the point of this stack and a panel
  # that lags the system it is drawing teaches the wrong thing. The whole chain
  # is sized to match: scrape every 2s, the collector reads every 1s, the
  # browser polls every 1s, so a change reaches the screen in about 3 seconds
  # rather than the 20 or so it used to take.
  #
  # Affordable only because this is thirteen local containers. A real estate
  # would not scrape this hard.
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  # Name-based discovery rather than a static host list, because compose can run more
  # than one copy of a service. `docker compose up --scale worker-service=4`
  # returns four A records for `worker-service`, and Prometheus scrapes all
  # four. A static target would have found exactly one of them and silently
  # under-reported everything.
  - job_name: services
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - gateway-service
          - outbox-relay
          - worker-service
          - notifier-service
          - audit-service
          - echo-service
        type: A
        port: 8080

    relabel_configs:
      # The discovered target is an IP, which is unreadable on a dashboard and
      # changes whenever a container restarts. Keep the instance label, but add
      # a stable `service` label taken from the resolved name that found it.
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The two tools that were watching everything and being watched by nothing.
  #
  # An operator asked "is the tracing still recording" had no way to answer
  # before these existed: Jaeger and Grafana were drawn on the mimic panel with
  # a lamp that could only ever say "unknown", because nothing scraped them.
  #
  # Neither needs a change to compose.yaml. Prometheus reaches both across the
  # internal network by container name, and neither port has to be published to
  # the host for that to work.

  # 14269 is the Jaeger administration port, which is separate from the 16686
  # user interface and the 4317 collector. jaeger_collector_spans_received_total
  # is the count that answers "is anything still arriving".
  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:14269"]

  # Grafana serves its own metrics on the same port as its user interface, with
  # no authentication in front of them. grafana_stat_totals_dashboard is how
  # many dashboards exist; the request histogram counts what it has served.
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
